<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portal SIB Sabah</title>
  <meta name="description" content="Portal SIB Sabah — acara, pengumuman dan RSVP gereja SIB.">
  <meta name="theme-color" content="#2B2F7A">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Portal SIB">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <!-- Text size (Small/Medium/Large) applied before first paint so there is no flash. Same logic as ui.js getTextSize(). -->
  <script>try{var z=localStorage.getItem('sibp-textsize');if(['small','medium','large'].indexOf(z)<0)z=localStorage.getItem('sibp-big-text')==='1'?'large':'medium';document.documentElement.setAttribute('data-textsize',z)}catch(e){document.documentElement.setAttribute('data-textsize','medium')}</script>
  <style>
/* SIB Piasau — minimalist, elderly-friendly. Colours from the logo.
   navy #2B2F7A text/headers · sky #1BA8E0 primary buttons/active · yellow #FFF200 soft highlight only
   red #E31E24 only for warnings / cancel / Not Going. All sizes in rem so the phone's text-size setting applies;
   --s scales everything (text, buttons, inputs, PIN pad, icons, spacing) for the in-app Text size setting:
   Small 0.9 · Medium 1 (default, the original look) · Large 1.2. Set on <html data-textsize> before first paint (index.html). */
:root {
  --navy: #2B2F7A; --sky: #1BA8E0; --sky-tint: #E3F4FB; --yellow: #FFF200; --yellow-soft: #FFFBD1; --red: #E31E24; --red-text: #C8161C; --red-tint: #FDECEC;
  --ink: #2B2F7A; --muted: #4A4E78; --line: #D9DBEA; --field: #6B6F9A; --soft: #F3F4FA; --white: #FFFFFF;
  --s: .88;   /* v1.1.5: everything ~12% smaller (Hale) */
  --tap: max(44px, calc(3rem * var(--s)));   /* 48px tap target at Medium, never below 44px */
  --sp: calc(1rem * var(--s));               /* 16px base spacing */
  --fs: calc(1.125rem * var(--s));        /* 18px body */
  --fs-lg: calc(1.25rem * var(--s));      /* 20px buttons */
  --fs-h2: calc(1.5rem * var(--s));       /* 24px */
  --fs-h1: calc(1.75rem * var(--s));      /* 28px */
  --btn-h: calc(3.5rem * var(--s));       /* 56px */
  --radius: 14px;
  --tabs-h: calc(4.5rem * var(--s));
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
html[data-textsize="small"] { --s: .8; }   /* body 16.2px, buttons 50px */
html[data-textsize="large"] { --s: 1.05; }  /* body 21.6px, buttons 67px */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* iOS: follow the Dynamic Type (Settings › Display › Text Size) setting */
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--white); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  font-size: var(--fs); line-height: 1.5; -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(var(--bar-h, var(--tabs-h)) + var(--safe-b) + 36px); /* --bar-h: measured toolbar height (app.js) */
}
body.no-chrome { padding-bottom: calc(var(--safe-b) + 24px); }
h1 { font-size: var(--fs-h1); line-height: 1.25; margin: calc(8px * var(--s)) 0 calc(12px * var(--s)); font-weight: 800; }
h2 { font-size: var(--fs-h2); line-height: 1.3; margin: calc(28px * var(--s)) 0 calc(12px * var(--s)); font-weight: 800; }
p { margin: 8px 0; }
a { color: var(--navy); }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--navy); color: #fff; padding: 12px 16px; z-index: 100; }
.skip:focus { left: 8px; }
.center { text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.lead { font-size: var(--fs); color: var(--muted); }
.muted { color: var(--muted); }
.small-print { font-size: var(--fs); color: var(--muted); }
.hint { background: var(--yellow-soft); border-radius: 10px; padding: 8px 12px; color: var(--navy); display: inline-block; }
p.hint.center { display: block; }
.ic { flex: none; }
.loading { padding: 40px; text-align: center; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--white); border-bottom: 2px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(8px + var(--safe-t)) 12px 8px 12px; min-height: calc(64px * var(--s));
}
.topbar:empty { display: none; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--navy); font-weight: 800; font-size: calc(1.5rem * var(--s)); min-height: var(--tap); min-width: 0; flex: 1; }
.brand img { width: min(calc(44px * var(--s)), 48px); height: min(calc(44px * var(--s)), 48px); object-fit: contain; flex: none; }
/* v0.7.0: the name uses the space freed by the icon-only menu button; never cut off — wraps to two lines if it must (Large) */
.brand span { white-space: normal; overflow-wrap: anywhere; line-height: 1.15; min-width: 0; }
.menu-btn { flex: none; }
.menu-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px; min-height: max(48px, var(--tap)); min-width: max(48px, var(--tap)); padding: 0 calc(8px * var(--s));
  background: var(--white); color: var(--navy); border: 2px solid var(--navy); border-radius: 12px;
  font: inherit; font-weight: 700; cursor: pointer;
}

/* ---------- bottom toolbar (v0.7.0): members Utama | Sel | RSVP | Profil · admins/owner Utama | Sel | (+) | RSVP | Profil ---------- */
/* v1.1.1: floating pill, lifted off the screen edge (Hale) */
.tabs {
  position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-b) + 12px); z-index: 20; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: stretch;
  max-width: 616px; margin: 0 auto; background: var(--white); border: 2px solid var(--line); border-radius: 26px; padding: 0 6px;
  box-shadow: 0 8px 24px rgba(43, 47, 122, .18);
}
.tabs.tabs-admin { grid-template-columns: repeat(5, minmax(0, 1fr)); }   /* equal columns: the + sits in the exact centre */
.tabs:empty { display: none; }
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; min-height: var(--tabs-h); min-width: 0;
  text-decoration: none; color: var(--muted); font-weight: 800; position: relative; padding: 8px 2px 8px;
}
.tab > span { font-size: min(var(--fs), 1.125rem); line-height: 1.15; text-align: center; white-space: nowrap; }  /* one short word, never wrapped or cut */
.tab .ic { stroke-width: 2; }
.tab.active { color: var(--navy); background: var(--sky-tint); border-radius: 20px; margin: 6px 0; }
.tab.active .ic { color: #0E7FB0; }
.tab.active::before { display: none; content: ""; position: absolute; top: -2px; left: 14%; right: 14%; height: 5px; border-radius: 0 0 4px 4px; background: var(--sky); }
/* Centre "+" (admins/owner): plus-in-circle line icon, sky fill, raised above the bar */
.tab-new { color: var(--navy); padding-top: calc(40px * var(--s)); }
.tab-new.active { background: transparent; }
.tab-new.active::before { display: none; }
.tab-plus { position: absolute; top: calc(-22px * var(--s)); left: 50%; transform: translateX(-50%); display: flex; border-radius: 50%; background: var(--white);
  padding: 3px; box-shadow: 0 4px 12px rgba(43, 47, 122, .22); }
.tab-plus .ic { color: var(--navy); }
.tab-plus .ic circle { fill: var(--sky); }
.tab-new:active .tab-plus .ic circle { fill: #1797C9; }
.tab-new.active .tab-plus { box-shadow: 0 0 0 4px var(--yellow), 0 4px 12px rgba(43, 47, 122, .22); }
.tab-new.active .ic { color: var(--navy); }

/* ---------- page ---------- */
main { display: block; outline: none; }
.page, .auth { padding: calc(12px * var(--s)) 16px var(--sp); max-width: 640px; margin: 0 auto; }
.back {
  display: flex; width: fit-content; align-items: center; gap: 4px; min-height: var(--tap); padding: 4px 12px 4px 4px; margin: 0 0 4px -4px;
  color: var(--navy); font-weight: 700; text-decoration: none; border-radius: 10px;
}
.back:active { background: var(--soft); }

/* ---------- buttons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: var(--btn-h);
  margin: calc(14px * var(--s)) 0; padding: calc(10px * var(--s)) calc(18px * var(--s)); border-radius: var(--radius); border: 2px solid transparent;
  font: inherit; font-size: var(--fs-lg); font-weight: 800; line-height: 1.25; text-decoration: none; text-align: center; cursor: pointer;
}
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
/* aria-disabled (not disabled): still tappable so the page can say what is missing */
/* Sky blue with navy text: brand colour and AA contrast for large bold text (white on sky blue is too faint). */
.btn-primary { background: var(--sky); color: var(--navy); border-color: var(--sky); }
.btn-primary:active:not(:disabled) { background: #1797C9; }
.btn-outline { background: var(--white); color: var(--navy); border-color: var(--navy); }
.btn-outline:active:not(:disabled) { background: var(--soft); }
.btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
.btn-danger-outline { background: var(--white); color: var(--red-text); border-color: var(--red); }
.btn-ghost { background: transparent; color: var(--navy); text-decoration: underline; font-weight: 700; font-size: var(--fs); }
.btn-sm { width: auto; min-height: var(--tap); margin: 0; padding: 6px 12px; font-size: var(--fs); flex: none; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-row .btn { margin: 8px 0 0; padding: 8px; }
.link { font-weight: 800; color: var(--navy); text-decoration: underline; text-underline-offset: 3px; display: inline-block; padding: 10px 4px; min-height: var(--tap); }

/* ---------- forms ---------- */
.field-label { display: block; font-weight: 800; margin: calc(18px * var(--s)) 0 6px; font-size: var(--fs); color: var(--navy); }
.input {
  display: block; width: 100%; min-height: var(--btn-h); padding: calc(10px * var(--s)) calc(14px * var(--s)); font: inherit; font-size: var(--fs); color: var(--ink);
  background: var(--white); border: 2px solid var(--field); border-radius: 12px; -webkit-appearance: none; appearance: none;
}
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--navy) 50%), linear-gradient(135deg, var(--navy) 50%, transparent 50%);
  background-position: calc(100% - 22px) 50%, calc(100% - 15px) 50%; background-size: 7px 7px; background-repeat: no-repeat; padding-right: 40px; text-overflow: ellipsis; }
textarea.input { min-height: calc(120px * var(--s)); resize: vertical; }
.input:focus { border-color: var(--sky); outline: 3px solid var(--sky-tint); }
.err { color: var(--red-text); font-weight: 700; background: var(--red-tint); padding: 10px 14px; border-radius: 10px; }
.err[hidden] { display: none; }
.code-input { font-size: calc(2rem * var(--s)); letter-spacing: .5em; text-align: center; font-weight: 800; }
.check-row { display: flex; gap: 12px; align-items: flex-start; padding: 14px; margin: 16px 0; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
.check-row input { width: calc(28px * var(--s)); height: calc(28px * var(--s)); margin: 2px 0 0; accent-color: var(--sky); flex: none; }
.search { position: relative; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: calc(26px + 24px * var(--s)); }
.filter-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.filter-grid > * { min-width: 0; }
.filter-grid .input { min-width: 0; padding-left: 10px; padding-right: 10px; }
.filter-grid .field-label { margin-top: 14px; }

/* ---------- auth ---------- */
.auth-top { display: flex; justify-content: flex-end; align-items: center; min-height: calc(56px * var(--s)); padding-top: var(--safe-t); }
.auth-top.split { justify-content: space-between; gap: 8px; }
.lang-btn { display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 0 14px; border: 2px solid var(--navy); border-radius: 12px; background: #fff; color: var(--navy); font: inherit; font-weight: 700; cursor: pointer; }
.auth-logo { display: block; margin: 4px auto 4px; width: calc(112px * var(--s)); height: calc(112px * var(--s)); object-fit: contain; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); margin: 8px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 2px; background: var(--line); }
.reg-link { margin-top: 12px; }
.step-count { font-weight: 700; color: var(--muted); }
.progress { height: 8px; background: var(--soft); border-radius: 8px; overflow: hidden; margin: 4px 0 12px; }
.progress span { display: block; height: 100%; background: var(--sky); border-radius: 8px; }
.option {
  display: flex; align-items: center; gap: var(--sp); width: 100%; min-height: calc(80px * var(--s)); margin: calc(14px * var(--s)) 0; padding: calc(14px * var(--s)) calc(18px * var(--s)); text-align: left;
  background: #fff; border: 2px solid var(--navy); border-radius: var(--radius); color: var(--navy); font: inherit; cursor: pointer; overflow-wrap: anywhere;
}
.option strong { font-size: var(--fs-lg); }
.option:active { background: var(--sky-tint); }
.option-off { border-color: #b9bcc8; color: #6b6f80; background: #f2f3f6; cursor: not-allowed; }
.option-off svg { opacity: .5; }
.note { display: flex; gap: 12px; align-items: flex-start; background: var(--yellow-soft); border-left: 6px solid var(--yellow); border-radius: 12px; padding: 14px; margin: 12px 0; }
.note p { margin: 0; }
.file-btn { position: relative; }
.big-ok { color: var(--sky); margin: 32px 0 8px; }

/* ---------- PIN pad ---------- */
.pinpad { margin: 8px auto; max-width: calc(360px * var(--s)); }
.pin-label { text-align: center; font-weight: 800; font-size: var(--fs-lg); margin: 4px 0 10px; }
.pin-dots { display: flex; justify-content: center; gap: calc(14px * var(--s)); margin-bottom: calc(18px * var(--s)); }
.pin-dots span { width: calc(22px * var(--s)); height: calc(22px * var(--s)); border-radius: 50%; border: 3px solid var(--navy); }
.pin-dots span.on { background: var(--navy); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(12px * var(--s)); }
.key {
  min-height: calc(4.25rem * var(--s)); border-radius: 16px; border: 2px solid var(--line); background: var(--soft); color: var(--navy);
  font: inherit; font-size: calc(1.875rem * var(--s)); font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
}
.key:active { background: var(--sky-tint); border-color: var(--sky); }
.key-del { font-size: var(--fs); flex-direction: column; gap: 0; background: #fff; }
.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

/* ---------- cards / lists ---------- */
.cards { list-style: none; margin: calc(12px * var(--s)) 0; padding: 0; display: grid; gap: calc(12px * var(--s)); }
.card { display: block; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: calc(14px * var(--s)); color: var(--ink); text-decoration: none; }
a.card:active { background: var(--soft); }
.event-card { display: flex; gap: calc(14px * var(--s)); align-items: flex-start; }
.datebox { flex: none; width: calc(64px * var(--s)); border-radius: 12px; background: var(--navy); color: #fff; text-align: center; padding: 8px 0 6px; line-height: 1.1; }
.datebox b { display: block; font-size: calc(1.75rem * var(--s)); }
.datebox span { font-size: var(--fs); text-transform: uppercase; font-weight: 700; }
.ec-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ec-title { font-weight: 800; font-size: var(--fs-lg); line-height: 1.3; margin: 0; }
.ec-meta { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); }
.ec-meta .ic { margin-top: 3px; }
.ec-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.is-cancelled .ec-title { text-decoration: line-through; }
.chip, .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: var(--fs); line-height: 1.3; }
.badge-going { background: var(--sky-tint); color: var(--navy); border: 2px solid var(--sky); }
.badge-maybe { background: var(--soft); color: var(--navy); border: 2px solid var(--navy); }
.badge-not_going { background: var(--red-tint); color: var(--red-text); border: 2px solid var(--red); }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; }
.empty .ic { color: var(--navy); }
.info-card p { margin: 4px 0; }

/* ---------- drawer (right side) ---------- */
.drawer-back { position: fixed; inset: 0; background: rgba(20, 22, 60, .5); z-index: 40; opacity: 0; transition: opacity .2s; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(88vw, 380px); background: #fff; overflow-y: auto;
  box-shadow: -8px 0 24px rgba(0,0,0,.18); transform: translateX(100%); transition: transform .22s ease-out;
  padding: calc(8px + var(--safe-t)) 0 calc(16px + var(--safe-b));
  display: flex; flex-direction: column;
}
.drawer-foot { margin-top: auto; padding: 20px 16px 4px; }
.btn-logout { width: 100%; background: var(--red); color: #fff; border-color: var(--red); }
.btn-logout .ic { color: #fff; }
.btn-logout:active { background: #B5161B; border-color: #B5161B; }
/* v1.1.9: admins get Admin (left) + Log out (right), side by side, equal width */
.drawer-foot.has-admin { display: flex; gap: 12px; }
.drawer-foot.has-admin .btn { flex: 1 1 0; width: auto; min-width: 0; padding-left: 10px; padding-right: 10px; }
.btn-admin { background: var(--navy); color: #fff; border-color: var(--navy); text-decoration: none; }
.btn-admin .ic { color: #fff; }
.btn-admin:active { background: #1F2260; border-color: #1F2260; }
#drawer-root.open .drawer { transform: none; }
#drawer-root.open .drawer-back { opacity: 1; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 12px 8px 20px; border-bottom: 2px solid var(--line); }
.drawer-head h2 { margin: 8px 0; }
.close-btn { display: flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0 14px; border: 2px solid var(--navy); border-radius: 12px; background: #fff; color: var(--navy); font: inherit; font-weight: 700; cursor: pointer; }
.cat-list { list-style: none; margin: 0; padding: 0; }
.cat-row { display: flex; align-items: center; gap: var(--sp); min-height: calc(72px * var(--s)); padding: 10px 16px 10px 20px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--navy); }
.cat-row:active { background: var(--soft); }
.cat-ic { display: inline-flex; align-items: center; justify-content: center; width: calc(52px * var(--s)); height: calc(52px * var(--s)); border-radius: 50%; flex: none; }
.cat-name { flex: 1; font-weight: 800; font-size: var(--fs-lg); }
.chev { color: var(--muted); }
.cat-sub { display: block; font-weight: 600; font-size: var(--fs); color: var(--muted); line-height: 1.3; margin: 0; }
.cat-head { display: flex; align-items: center; gap: 14px; margin: 4px 0 8px; }
.cat-head .cat-ic { width: calc(60px * var(--s)); height: calc(60px * var(--s)); }
.cat-head h1 { margin: 0; }

/* ---------- event detail ---------- */
.ev-title { margin-top: 12px; }
.facts { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 10px; }
.facts li { display: flex; gap: 12px; align-items: flex-start; font-weight: 600; }
.facts .ic { color: var(--sky); margin-top: 1px; }
.ev-details { background: var(--soft); border-radius: 12px; padding: 14px; }
.rsvp-q { margin-bottom: 4px; }
.rsvp-btns .btn { margin: 12px 0; min-height: calc(4rem * var(--s)); font-size: calc(1.375rem * var(--s)); border-width: 3px; }
.btn-going { background: var(--sky-tint); color: var(--navy); border-color: var(--sky); }
.btn-going .ic { color: #0E7FB0; }
.btn-going.selected { background: var(--sky); }
.btn-going.selected .ic { color: var(--navy); }
.btn-maybe { background: #fff; color: var(--navy); border-color: var(--navy); }
.btn-maybe.selected { background: var(--navy); color: #fff; }
.btn-notgoing { background: #fff; color: var(--red-text); border-color: var(--red); }
.btn-notgoing.selected { background: var(--red); color: #fff; }
.rsvp-btn.selected { box-shadow: 0 0 0 4px var(--yellow); }
.sel-tag { font-size: var(--fs); font-weight: 700; padding: 2px 10px; border-radius: 999px; background: rgba(255,255,255,.9); color: var(--navy); }
.stepper-wrap[hidden] { display: none; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.step-btn { flex: 1; min-height: calc(4rem * var(--s)); display: flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--navy); border-radius: 14px;
  background: #fff; color: var(--navy); font: inherit; font-weight: 800; cursor: pointer; }
.step-btn:active { background: var(--sky-tint); }
.step-val { min-width: calc(72px * var(--s)); text-align: center; font-size: calc(2.25rem * var(--s)); font-weight: 800; }
.counts { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 20px 0 4px; padding: 12px 14px; border-radius: 12px; background: var(--soft); }
.counts span { display: inline-flex; align-items: center; gap: 6px; }
.warn { display: flex; gap: 12px; align-items: flex-start; background: var(--red-tint); color: var(--red-text); border: 2px solid var(--red); border-radius: 12px; padding: 12px 14px; font-weight: 700; margin: 12px 0; }
.warn p { margin: 0; }

/* ---------- profile ---------- */
.me-card { display: flex; align-items: center; gap: var(--sp); margin: calc(12px * var(--s)) 0; }
.me-card > div { min-width: 0; overflow-wrap: anywhere; }
.me-name { font-weight: 800; font-size: var(--fs-lg); margin: 0; line-height: 1.3; }
.me-card p { margin: 2px 0; }
.role-tag { display: inline-block; margin-top: 4px !important; padding: 2px 12px; border-radius: 999px; background: var(--yellow-soft); border: 2px solid #E6D900; font-weight: 700; }
.avatar { border-radius: 50%; object-fit: cover; flex: none; background: var(--soft); aspect-ratio: 1 / 1; overflow: hidden; clip-path: circle(50%); display: inline-block; }
.avatar-i { display: inline-flex; align-items: center; justify-content: center; background: var(--sky-tint); color: var(--navy); font-weight: 800; }
.set-h { display: flex; align-items: center; gap: 10px; font-size: var(--fs-lg); margin: calc(28px * var(--s)) 0 8px; }
.segs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.segs-3 { grid-template-columns: repeat(3, 1fr); }
.seg { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--btn-h); padding: 6px 8px; border: 2px solid var(--navy); border-radius: 12px; background: #fff;
  color: var(--navy); font: inherit; font-weight: 800; cursor: pointer; text-align: center; line-height: 1.2; }
.seg.on { background: var(--navy); color: #fff; }
.switch-row { display: flex; align-items: center; gap: 12px; padding: 14px; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; min-height: var(--btn-h); }
.switch-row > span:first-child { flex: 1; }
.switch { -webkit-appearance: none; appearance: none; width: 64px; height: 36px; border-radius: 999px; background: #8A8DA8; position: relative; cursor: pointer; flex: none; margin: 0; transition: background .15s; }
.switch::before { content: ""; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch:checked { background: var(--sky); }
.switch:checked::before { transform: translateX(28px); }
.switch-state { font-weight: 800; min-width: 3em; }
.demo-box { margin: 28px 0 8px; padding: 4px 14px 2px; border: 2px dashed var(--field); border-radius: 16px; background: var(--soft); }
.demo-box .set-h { margin-top: 12px; }

/* ---------- admin ---------- */
.nav-row { display: flex; align-items: center; gap: calc(14px * var(--s)); min-height: calc(72px * var(--s)); }
.nav-row .ic:first-child { color: var(--sky); }
.nr-label { flex: 1; font-weight: 800; font-size: var(--fs-lg); }
.count-pill { min-width: 40px; padding: 2px 10px; border-radius: 999px; background: var(--soft); font-weight: 800; text-align: center; }
.count-pill.alert { background: var(--red); color: #fff; }
.result-count { font-weight: 700; margin-top: 4px; }
.member-row { display: flex; align-items: center; gap: 12px; }
.mr-body { display: flex; flex-direction: column; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.mr-name { font-weight: 800; margin: 0; }
.member-row.wrap { flex-wrap: wrap; }
.member-row.wrap .btn-sm { flex: 1 1 100%; width: 100%; margin-top: 4px; }
.mr-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.tag { padding: 0 10px; border-radius: 999px; font-weight: 700; border: 2px solid var(--line); }
.tag-active { background: var(--sky-tint); border-color: var(--sky); }
.tag-inactive { background: var(--soft); color: var(--muted); }
.tag-visitor { background: var(--yellow-soft); border-color: #E6D900; }
.tag-role { background: #fff; border-color: var(--navy); }
.admin-ev p { margin: 4px 0; }
.mini-counts { color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(12px * var(--s)); margin: 16px 0 4px; }
.tile { border: 2px solid var(--line); border-radius: 14px; padding: 12px; text-align: center; display: flex; flex-direction: column; }
.tile b { font-size: calc(2rem * var(--s)); line-height: 1.1; }
.tile-going { border-color: var(--sky); background: var(--sky-tint); }
.tile-no { border-color: var(--red); }
.grp-h { font-size: var(--fs-lg); margin-top: 24px; }
.found { display: flex; align-items: center; gap: 14px; margin-top: 12px; }

/* ---------- text size picker (Register step 1 + Profile) ---------- */
.ts-block { margin: 0 0 calc(4px * var(--s)); padding: 0 0 calc(16px * var(--s)); border-bottom: 2px solid var(--line); }
.ts-block .set-h { margin: 0 0 8px; }
.ts-picker { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.ts-opt { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 0;
  min-height: calc(5.5rem * var(--s)); padding: 8px 2px; border: 2px solid var(--navy); border-radius: 14px; background: #fff; color: var(--navy);
  font: inherit; font-weight: 800; cursor: pointer; }
.ts-opt:active { background: var(--sky-tint); }
.ts-opt.on { background: var(--navy); color: #fff; box-shadow: 0 0 0 3px var(--sky); }
.ts-aa { line-height: 1; font-weight: 800; }   /* fixed rem (not --s) so the three samples always compare */
.ts-small .ts-aa { font-size: 1.25rem; }
.ts-medium .ts-aa { font-size: 1.625rem; }
.ts-large .ts-aa { font-size: 2.125rem; }
.ts-lbl { font-size: min(var(--fs), 1.0625rem); line-height: 1.2; text-align: center; max-width: 100%; }
.ts-tick { position: absolute; top: 4px; right: 4px; color: var(--yellow); }

/* ---------- role badge (Profile) ---------- */
.role-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 4px 14px 4px 10px; border-radius: 999px; font-weight: 800; line-height: 1.3; }
.role-badge-admin { background: var(--sky-tint); color: var(--navy); border: 2px solid var(--sky); }
.role-badge-owner { background: var(--navy); color: #fff; border: 2px solid var(--navy); }
.role-badge-owner .ic { color: var(--yellow); }

/* ---------- AMG (restricted category) ---------- */
.cat-lock { display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.lock-hero { text-align: center; padding: calc(12px * var(--s)) 4px 0; }
.lock-hero .lock-circle { display: inline-flex; align-items: center; justify-content: center; width: calc(96px * var(--s)); height: calc(96px * var(--s));
  border-radius: 50%; background: var(--soft); color: var(--navy); border: 3px solid var(--line); margin: 8px 0; }
.lock-hero h2 { margin-top: 8px; }
.req-sent { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: var(--btn-h); margin: calc(14px * var(--s)) 0 4px; padding: 10px 14px;
  border-radius: var(--radius); background: var(--sky-tint); border: 2px solid var(--sky); font-weight: 800; font-size: var(--fs-lg); text-align: center; }
.restricted-note { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; color: var(--muted); }
.amg-req .btn-row .btn { min-height: var(--btn-h); }
.amg-req .muted { margin: 2px 0; }

/* ---------- profile picture picker (v0.5.0) ---------- */
.avatar-preset { background: transparent; }
.av-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(12px * var(--s)); }
.av-tile { position: relative; display: block; width: 100%; padding: 0; margin: 0; border: 0; border-radius: 50%; background: transparent; cursor: pointer;
  -webkit-appearance: none; appearance: none; font: inherit; color: inherit; min-height: var(--tap); }
/* v0.7.0: always a perfect circle. The ::before padding keeps the tile square even where aspect-ratio on a <button> is ignored
   (older iOS Safari), so the disc can never turn into an oval or a rounded square. */
.av-tile::before { content: ""; display: block; padding-top: 100%; }
.av-disc { position: absolute; inset: 0; display: block; border-radius: 50%; overflow: hidden; clip-path: circle(50%);
  border: 3px solid var(--line); background: #fff; padding: 6px; }
.av-disc img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; clip-path: circle(50%); }
.av-tile:active .av-disc { background: var(--sky-tint); }
.av-tile.on .av-disc { border: 4px solid var(--sky); background: var(--sky-tint); clip-path: none; box-shadow: 0 0 0 4px var(--navy); overflow: visible; }
.av-tile.on .av-disc img { border-radius: 50%; }
.av-tile:focus-visible { outline: none; }
.av-tile:focus-visible .av-disc { outline: 3px solid var(--sky); outline-offset: 6px; border-radius: 50%; }
.av-tick { position: absolute; right: 0; bottom: 0; box-sizing: content-box; padding: calc(4px * var(--s)); border-radius: 50%; background: var(--navy); color: #fff; border: 3px solid #fff; z-index: 1; }
.av-own { display: flex; flex-direction: column; align-items: center; margin: 8px 0 4px; }
.av-own[hidden] { display: none; }
.av-own .av-tile { width: calc(120px * var(--s)); }
.av-own-lbl { font-weight: 800; margin: 6px 0 0; }
.av-picker .note { margin-top: 0; }

/* ---------- church + transfer requests (v0.5.0) ---------- */
.me-church { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.small-note { font-size: var(--fs); margin-top: 0; }
.tr-outcome { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; background: var(--soft); font-weight: 700; margin: 8px 0; }
.tr-outcome .ic { margin-top: 2px; }
.tr-approved { background: var(--sky-tint); }
.tr-rejected { background: var(--red-tint); color: var(--red-text); }
.tr-when { display: block; font-weight: 600; }
.tr-rejected .tr-when { color: var(--red-text); }
.tr-lock { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 8px; padding: 10px 14px; border-radius: 12px; background: var(--yellow-soft); border-left: 6px solid var(--yellow); font-weight: 800; }
.tr-lock .ic { margin-top: 2px; }
.tr-pending { border-color: var(--sky); background: var(--sky-tint); }
.tr-pending p { margin: 4px 0; }
.tr-pending .btn { margin-bottom: 0; background: #fff; }
.tr-status { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: var(--fs-lg); }
.radio-set { border: 0; margin: 0; padding: 0; min-width: 0; }
.radio-opt { display: flex; align-items: center; gap: var(--sp); min-height: calc(76px * var(--s)); margin: 0 0 calc(12px * var(--s)); padding: calc(12px * var(--s)) calc(16px * var(--s));
  border: 2px solid var(--navy); border-radius: var(--radius); cursor: pointer; background: #fff; }
.radio-opt input { width: calc(30px * var(--s)); height: calc(30px * var(--s)); margin: 0; accent-color: var(--navy); flex: none; }
.radio-opt.on, .radio-opt:has(input:checked) { background: var(--sky-tint); border-color: var(--sky); box-shadow: 0 0 0 3px var(--navy); }
.ro-body { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.ro-name { font-weight: 800; font-size: var(--fs-lg); line-height: 1.3; }
.tr-req .muted, .tr-req p { margin: 4px 0; }
.tr-route { display: flex; flex-direction: column; font-weight: 700; }
.tr-reason { background: var(--soft); border-radius: 10px; padding: 8px 12px; overflow-wrap: anywhere; }
.tr-req .btn-row .btn { min-height: var(--btn-h); }

/* ---------- toast + modal ---------- */
.toast {
  position: fixed; left: 12px; right: 12px; bottom: calc(var(--bar-h, var(--tabs-h)) + var(--safe-b) + 24px); z-index: 60; display: flex; align-items: center; gap: 12px;
  background: var(--navy); color: #fff; padding: 16px 18px; border-radius: 14px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  opacity: 0; transform: translateY(16px); pointer-events: none; transition: opacity .2s, transform .2s; max-width: 616px; margin: 0 auto;
}
.toast.show { opacity: 1; transform: none; }
.toast-ok .ic { color: var(--yellow); }
.toast-warn { background: var(--red-text); }
body.no-chrome .toast { bottom: calc(var(--safe-b) + 16px); }
.modal-back { position: fixed; inset: 0; z-index: 70; background: rgba(20, 22, 60, .55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: #fff; border-radius: 18px; padding: 20px; width: 100%; max-width: 440px; }
.modal h2 { margin-top: 4px; }
.modal .btn { margin: 10px 0 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- cell groups (v0.6.0) ---------- */
.field-help { margin: 0 0 8px; }
.me-cg { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--navy); margin: 4px 0; overflow-wrap: anywhere; }
.me-cg .ic, .me-church .ic { flex: none; }
.cg-select { font-weight: 700; }
.cg-prompt { border: 3px solid var(--sky); background: var(--sky-tint); margin: 0 0 var(--sp); }
.cg-prompt p { margin: 4px 0 8px; }
.cg-prompt-title { display: flex; align-items: flex-start; gap: 10px; font-weight: 800; font-size: var(--fs-lg); color: var(--navy); }
.cg-prompt-title .ic { flex: none; margin-top: 2px; }
.cg-prompt .btn { margin-bottom: 0; }
.cg-row .mr-name { margin: 0; overflow-wrap: anywhere; }
.cg-count { display: flex; align-items: center; gap: 6px; margin: 4px 0 0; }
.cg-row .btn-row .btn { min-height: var(--btn-h); min-width: 0; overflow-wrap: anywhere; }
.cg-edit .field-label { margin-top: 0; }
.cg-edit[hidden], .cg-view[hidden] { display: none; }
.cg-notsure { margin-top: 12px; }
/* Rename / Remove: side by side only when both labels fit on one line; on phones they stack full-width (no wrapped labels at any text size) */
.cg-row .btn-row { grid-template-columns: repeat(auto-fit, minmax(min(100%, 11em), 1fr)); gap: 0 10px; }
.cg-row .btn-row .btn { white-space: nowrap; }

/* ---------- v0.7.0: Edit profile gear, announcements ---------- */
.me-body { flex: 1; }
.me-head { display: flex; align-items: flex-start; gap: 8px; }
.me-head .me-name { flex: 1; min-width: 0; padding-top: 4px; }
.gear-btn { flex: none; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  min-width: max(48px, calc(56px * var(--s))); min-height: max(48px, calc(56px * var(--s))); padding: 4px 6px; margin: -4px -4px 0 0;
  border: 2px solid var(--navy); border-radius: 14px; background: #fff; color: var(--navy); text-decoration: none; font-weight: 800; font-size: min(var(--fs), 1.0625rem); line-height: 1.1; }
.gear-btn:active { background: var(--sky-tint); }
.edit-back { margin-top: calc(28px * var(--s)); }
.cg-prompt-inline { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; background: var(--sky-tint); border: 2px solid var(--sky); font-weight: 700; margin: 4px 0 8px; }
.cg-prompt-inline .ic { flex: none; margin-top: 2px; }

.ann-section { margin-bottom: 4px; }
.ann-h { font-size: var(--fs-h2); margin-top: calc(20px * var(--s)); }
.ann-card { border-color: var(--sky); border-left: 8px solid var(--sky); }
.ann-card p { margin: 4px 0; }
.ann-title { display: flex; align-items: flex-start; gap: 8px; font-weight: 800; font-size: var(--fs-lg); line-height: 1.3; color: var(--navy); overflow-wrap: anywhere; }
.ann-title .ic { flex: none; margin-top: 1px; color: #0E7FB0; }
.ann-card .ec-meta { overflow-wrap: anywhere; }
.ann-desc { background: var(--soft); border-radius: 10px; padding: 8px 12px; overflow-wrap: anywhere; white-space: pre-line; }
.ann-del { margin: 10px 0 0; min-height: var(--tap); }
.ann-for { display: flex; align-items: center; gap: 8px; font-weight: 800; margin: 4px 0; }
.ann-for .ic { flex: none; }
.req-note { font-weight: 600; color: var(--muted); }
.counter { margin: 4px 0 0; font-weight: 700; color: var(--muted); text-align: right; }
.counter.at-limit { color: var(--red-text); }
.input.invalid { border-color: var(--red); background: var(--red-tint); }
.ann-field .err { margin-top: 6px; }
/* Date + time side by side when they fit; stacked on narrow screens / Large text */
.ann-2col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10.5em), 1fr)); gap: 0 12px; }
.ann-2col > * { min-width: 0; }
input[type="date"].input, input[type="time"].input { min-width: 0; text-align: left; }
input[type="date"].input::-webkit-date-and-time-value, input[type="time"].input::-webkit-date-and-time-value { text-align: left; }

/* ---------- v0.7.0: Kelompok sel tab, RSVP tab ---------- */
.cg-card { border-color: var(--sky); background: var(--sky-tint); }
.cg-card p { margin: 4px 0; }
.cg-name { display: flex; align-items: flex-start; gap: 10px; font-weight: 800; font-size: var(--fs-h2); line-height: 1.25; color: var(--navy); overflow-wrap: anywhere; }
.cg-name .ic { flex: none; margin-top: 2px; }
.cg-members { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: calc(8px * var(--s)); }
.cg-member { display: flex; align-items: center; gap: 12px; padding: calc(8px * var(--s)) calc(12px * var(--s)); border: 2px solid var(--line); border-radius: 14px; }
.cg-member .mr-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.you-tag { flex: none; padding: 2px 10px; border-radius: 999px; background: var(--navy); color: #fff; font-weight: 800; }
.cg-none { text-align: center; }
.cg-none .lock-circle { display: inline-flex; align-items: center; justify-content: center; width: calc(88px * var(--s)); height: calc(88px * var(--s)); border-radius: 50%; background: var(--sky-tint); color: var(--navy); margin: 8px 0; }
.badge-none { background: var(--yellow-soft); color: var(--navy); border: 2px solid #E6D900; }
.owner-church { border-color: var(--navy); background: var(--soft); } .owner-church .field-label { margin-top: 0; } .owner-church .input { background-color: #fff; }

/* ---------- v0.8.0 date of birth: three scroll wheels (Hari · Bulan · Tahun) ---------- */
.me-dob { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--navy); margin: 4px 0; }
.me-dob .ic { flex: none; }
.dob { --dob-row: max(48px, calc(3.25rem * var(--s)));   /* 52px Medium · 48px Small · 62px Large */
  --dob-fs: max(20px, calc(1.375rem * var(--s)));          /* 22px Medium · 20px Small · 26px Large */
  margin: 0 0 4px; }
.dob-help { margin: 0 0 8px; }
.dob-cols { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.9fr) minmax(0, 1.25fr); gap: calc(8px * var(--s)); }
.dob-col { min-width: 0; display: flex; flex-direction: column; }
.dob-lbl { display: block; text-align: center; font-weight: 800; color: var(--navy); font-size: var(--fs); margin-bottom: 4px; white-space: nowrap; }
.dob-wheel { position: relative; height: calc(var(--dob-row) * 3); border: 2px solid var(--field); border-radius: var(--radius); background: var(--white); overflow: hidden; }
/* centre band = the value. Dashed + grey until the user touches the wheel; solid sky when chosen */
.dob-wheel::before { content: ""; position: absolute; left: 4px; right: 4px; top: var(--dob-row); height: var(--dob-row); border-radius: 10px;
  background: var(--soft); border: 2px dashed var(--field); box-sizing: border-box; pointer-events: none; z-index: 0; }
.dob-wheel.chosen::before { background: var(--sky-tint); border: 3px solid var(--sky); }
/* soft fade on the rows above and below the band */
.dob-wheel::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: linear-gradient(to bottom, rgba(255,255,255,.85), rgba(255,255,255,0) 34%, rgba(255,255,255,0) 66%, rgba(255,255,255,.85)); }
.dob-wheel:focus-within { outline: 3px solid var(--sky); outline-offset: 3px; }
.dob-scroll { position: relative; z-index: 1; height: 100%; overflow-y: auto; overflow-x: hidden; scroll-snap-type: y mandatory;
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; touch-action: pan-y; }
.dob-scroll::-webkit-scrollbar { display: none; }
.dob-scroll:focus { outline: none; }
.dob-spacer { height: var(--dob-row); }
.dob-opt { height: var(--dob-row); display: flex; align-items: center; justify-content: center; scroll-snap-align: center; scroll-snap-stop: normal;
  font-size: var(--dob-fs); font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; padding: 0 4px; user-select: none; -webkit-user-select: none; }
.dob-wheel .dob-opt.on { color: var(--field); font-weight: 700; }
.dob-wheel.chosen .dob-opt.on { color: var(--navy); font-weight: 800; }
.dob-opt.dob-x { color: #A9ABC4; text-decoration: line-through; }
.dob-wheel.chosen .dob-opt.on.dob-x { color: var(--red-text); }
.dob-invalid .dob-wheel[data-part="d"].chosen::before { border-color: var(--red); background: var(--red-tint); }
.dob-words { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; font-weight: 800; font-size: var(--fs-lg); color: var(--navy); }
.dob-words .ic { flex: none; }
.dob-words-ok .ic { color: var(--sky); }
.dob-words-todo { font-weight: 700; font-size: var(--fs); color: var(--muted); }
.dob-words-bad { color: var(--red-text); }
.dob .err { margin-top: 4px; }
/* Large text: the month column gets more room so "September" / "Disember" stay whole */
