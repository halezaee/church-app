 their trust in you, for you, O LORD, have not forsaken those who seek you."},{r:"PSA.16.8",ms:"Aku sentiasa menurut panduan TUHAN. Dia ada di sisi kananku, aku tidak akan goyah.",en:"I have set the LORD always before me; because he is at my right hand, I shall not be shaken."},{r:"PSA.16.11",ms:"Engkau akan menunjukkan aku jalan hidup; di hadirat-Mu sepenuh bahagia dirasai, di tangan kanan-Mu nikmat dikecapi selama-lamanya.",en:"You make known to me the path of life; in your presence there is fullness of joy; at your right hand are pleasures forevermore."},{r:"PSA.18.2",ms:"TUHAN ialah batu pejalku, kubuku dan penyelamatku; Allahku batu pejalku, kepada-Nya aku berlindung. Dialah perisaiku, tanduk penyelamatanku, benteng pertahananku.",en:"The LORD is my rock and my fortress and my deliverer, my God, my rock, in whom I take refuge, my shield, and the horn of my salvation, my stronghold."},{r:"PSA.19.1",ms:"Seluruh langit mengakui kemuliaan Allah; dan cakerawala menunjukkan ciptaan-Nya.",en:"The heavens declare the glory of God, and the sky above proclaims his handiwork."},{r:"PSA.19.14",ms:"Semoga segala yang kututurkan dengan lidah dan kurenungkan dalam hati diterima oleh-Mu, Ya TUHAN, Batu Pejalku dan Penebusku.",en:"Let the words of my mouth and the meditation of my heart be acceptable in your sight, O LORD, my rock and my redeemer."},{r:"PSA.23.1",ms:"TUHAN ialah gembalaku, aku tidak akan kekurangan apa-apa pun.",en:"The LORD is my shepherd; I shall not want."},{r:"PSA.23.4",ms:"Ya, meski aku melangkah di lembah bayangan maut, aku tidak akan takut kepada kejahatan, kerana Engkau ada bersamaku; gada dan tongkat-Mu menetapkan hatiku.",en:"Even though I walk through the valley of the shadow of death, I will fear no evil, for you are with me; your rod and your staff, they comfort me."},{r:"PSA.23.6",ms:"Tentulah kebaikan dan kasih akan mengiringiku seumur hidupku, dan aku akan tinggal di dalam rumah TUHAN selama-lamanya.",en:"Surely goodness and mercy shall follow me all the days of my life, and I shall dwell in the house of the LORD forever."},{r:"PSA.25.4",ms:"Tunjukkanlah aku jalan-Mu, ya TUHAN, ajarkanlah aku mengikut jalan-Mu",en:"Make me to know your ways, O LORD; teach me your paths."},{r:"PSA.25.5",ms:"bimbinglah aku kepada kebenaran-Mu dan ajarlah aku, kerana Engkaulah Allah Penyelamatku, Engkau kunantikan sepanjang waktu.",en:"Lead me in your truth and teach me, for you are the God of my salvation; for you I wait all the day long."},{r:"PSA.27.1",ms:"TUHAN cahayaku dan penyelamatanku \u2014 siapa perlu kutakuti? TUHAN kekuatan hidupku \u2014 siapa harus aku gentar?",en:"The LORD is my light and my salvation; whom shall I fear? The LORD is the stronghold of my life; of whom shall I be afraid?"},{r:"PSA.27.14",ms:"Nantikanlah TUHAN; tabahkan dirimu, teguhkan hatimu. Ya, nantikanlah TUHAN!",en:"Wait for the LORD; be strong, and let your heart take courage; wait for the LORD!"},{r:"PSA.28.7",ms:"TUHAN kekuatan dan perisaiku; hatiku percaya kepada-Nya, dan aku ditolong-Nya. Oleh itu, hatiku amat gembira dan dengan nyanyianku aku akan memuji-Nya.",en:"The LORD is my strength and my shield; in him my heart trusts, and I am helped; my heart exults, and with my song I give thanks to him."},{r:"PSA.29.11",ms:"TUHAN akan memberikan kekuatan kepada umat-Nya; TUHAN akan memberkati umat-Nya dengan kesejahteraan.",en:"May the LORD give strength to his people! May the LORD bless his people with peace!"},{r:"PSA.30.5",ms:"Kerana kemurkaan-Nya cuma sebentar, keredaan-Nya sepanjang kehidupan kekal; tangisan mungkin berlangsung semalaman, tetapi kegembiraan muncul sewaktu pagi.",en:"For his anger is but for a moment, and his favor is for a lifetime. Weeping may tarry for the night, but joy comes with the morning."},{r:"PSA.31.24",ms:"Tabahkan dirimu, teguhkan hatimu, semua kamu yang berharap kepada TUHAN.",en:"Be strong, and let your heart take courage, all you who wait for the LORD!"},{r:"PSA.32.8",ms:"Aku akan mendidik dan mengajarmu ke jalan yang benar; Aku akan membimbingmu dengan mata-Ku.",en:"I will instruct you and teach you in the way you should go; I will counsel you with my eye upon you."},{r:"PSA.34.1",ms:"Aku akan memuji TUHAN setiap waktu; puji-pujian untuk-Nya akan sentiasa di bibirku.",en:"I will bless the LORD at all times; his praise shall continually be in my mouth."},{r:"PSA.34.4",ms:"Aku telah berseru kepada TUHAN, dan Dia mendengar seruanku; lalu Dia menyelamatkanku daripada semua yang kutakuti.",en:"I sought the LORD, and he answered me and delivered me from all my fears."},{r:"PSA.34.8",ms:"Rasakan dan lihatlah kebaikan TUHAN; diberkatilah orang yang berlindung kepada-Nya.",en:"Oh, taste and see that the LORD is good! Blessed is the man who takes refuge in him!"},{r:"PSA.34.18",ms:"TUHAN merapati orang yang patah hati dan menyelamatkan orang yang menyesal.",en:"The LORD is near to the brokenhearted and saves the crushed in spirit."},{r:"PSA.37.4",ms:"Cari kebahagiaan daripada TUHAN, maka Dia akan menunaikan hasrat hatimu.",en:"Delight yourself in the LORD, and he will give you the desires of your heart."},{r:"PSA.37.5",ms:"Serahkan jalan hidupmu kepada TUHAN; percayalah kepada-Nya maka Dia akan bertindak",en:"Commit your way to the LORD; trust in him, and he will act."},{r:"PSA.37.7",ms:"Sandarkan hatimu kepada TUHAN dan sabarlah menanti tindakan-Nya; jangan gusar kerana ada yang makmur mengikut jalan sendiri, kerana ada yang menjayakan rancangan zalim.",en:"Be still before the LORD and wait patiently for him; fret not yourself over the one who prospers in his way, over the man who carries out evil devices!"},{r:"PSA.40.1",ms:"Aku menantikan TUHAN dengan sabar; lalu Dia berpaling kepadaku dan mendengar rayuanku.",en:"I waited patiently for the LORD; he inclined to me and heard my cry."},{r:"PSA.42.11",ms:"Mengapa kau nestapa, wahai jiwaku? Mengapa kau resah gelisah? Berharaplah kepada Allah, kerana aku akan memuji-Nya, Penyelamatku dan Allahku.",en:"Why are you cast down, O my soul, and why are you in turmoil within me? Hope in God; for I shall again praise him, my salvation and my God."},{r:"PSA.46.1",ms:"Allah Pelindung dan Pemberi kekuatan kepada kita, sentiasa sedia menolong pada waktu kesusahan.",en:"God is our refuge and strength, a very present help in trouble."},{r:"PSA.46.10",ms:"\u201CDiamlah, dan ketahuilah Aku Allah; Aku akan dimuliakan dalam kalangan bangsa-bangsa, Aku akan dimuliakan di bumi ini.\u201D",en:"\u201CBe still, and know that I am God. I will be exalted among the nations, I will be exalted in the earth!\u201D"},{r:"PSA.51.10",ms:"Ciptakan hati yang bersih dalam diriku, ya Allah, dan pulihkan semangat waja dalam jiwaku.",en:"Create in me a clean heart, O God, and renew a right spirit within me."},{r:"PSA.55.22",ms:"Serahkanlah bebanmu kepada TUHAN, Dia akan menolongmu; Dia tidak akan membiarkan orang yang benar dikalahkan.",en:"Cast your burden on the LORD, and he will sustain you; he will never permit the righteous to be moved."},{r:"PSA.56.3",ms:"Apabila aku berasa takut, aku berharap kepada-Mu.",en:"When I am afraid, I put my trust in you."},{r:"PSA.62.1",ms:"Sesungguhnya, jiwaku senyap hening menantikan Allah; daripada-Nya datang penyelamatanku.",en:"For God alone my soul waits in silence; from him comes my salvation."},{r:"PSA.62.8",ms:"Percayalah kepada-Nya setiap waktu, hai umatku; curahkan isi hatimu di hadirat-Nya, Allah Pelindung kita.",en:"Trust in him at all times, O people; pour out your heart before him; God is a refuge for us."},{r:"PSA.63.1",ms:"Ya Allah, Engkau Allahku, aku akan mencari-Mu segera; jiwaku dahaga kepada-Mu, jasadku merindui-Mu, di tanah gersang tandus tanpa air.",en:"O God, you are my God; earnestly I seek you; my soul thirsts for you; my flesh faints for you, as in a dry and weary land where there is no water."},{r:"PSA.66.20",ms:"Segala puji bagi Allah, yang tidak menolak doaku dan tidak menyingkirkan aku daripada kasih-Nya!",en:"Blessed be God, because he has not rejected my prayer or removed his steadfast love from me!"},{r:"PSA.68.19",ms:"Segala puji bagi Tuhan, Allah Penyelamat kita, yang setiap hari memikul beban kita.",en:"Blessed be the Lord, who daily bears us up; God is our salvation."},{r:"PSA.71.5",ms:"Kerana Engkaulah harapanku, ya Tuhan yang perkasa; ya TUHAN, Engkaulah kepercayaanku sejak daripada usia mudaku.",en:"For you, O Lord, are my hope, my trust, O LORD, from my youth."},{r:"PSA.73.26",ms:"Tubuh dan hatiku layu, tetapi Allah kekuatan hatiku dan untukku selama-lamanya.",en:"My flesh and my heart may fail, but God is the strength of my heart and my portion forever."},{r:"PSA.84.11",ms:"Kerana Allah TUHAN ialah matahari dan perisai; TUHAN akan memberi kasih kurnia dan kemuliaan; tiada kebaikan yang tidak dilimpahkan-Nya kepada mereka yang hidup tulus.",en:"For the LORD God is a sun and shield; the LORD bestows favor and honor. No good thing does he withhold from those who walk uprightly."},{r:"PSA.86.5",ms:"Kerana Engkau, ya Tuhan, baik dan sedia mengampuni, serta melimpahkan kasih kepada semua yang menyeru-Mu.",en:"For you, O Lord, are good and forgiving, abounding in steadfast love to all who call upon you."},{r:"PSA.90.12",ms:"Oleh itu, ajarlah kami menghitung hari kehidupan kami, supaya hati kami bijaksana.",en:"So teach us to number our days that we may get a heart of wisdom."},{r:"PSA.91.1",ms:"Sesiapa yang tinggal di tempat rahsia Yang Maha Tinggi akan menetap di bawah bayang-bayang Yang Maha Kuasa.",en:"He who dwells in the shelter of the Most High will abide in the shadow of the Almighty."},{r:"PSA.91.2",ms:"Aku akan berkata tentang TUHAN, \u201CDialah penaungku dan bentengku, Allahku, akan kupercaya kepada-Nya.\u201D",en:"I will say to the LORD, \u201CMy refuge and my fortress, my God, in whom I trust.\u201D"},{r:"PSA.91.11",ms:"Kerana Dia akan memerintahkan malaikat-malaikat-Nya menjagamu untuk memeliharamu walau di mana kamu berada.",en:"For he will command his angels concerning you to guard you in all your ways."},{r:"PSA.92.1",ms:"Sungguh baik mengucap syukur kepada TUHAN dan menyanyikan pujian untuk nama-Mu, wahai Yang Maha Tinggi",en:"It is good to give thanks to the LORD, to sing praises to your name, O Most High"},{r:"PSA.95.6",ms:"Marilah, marilah kita menyembah dan tunduk, marilah kita berlutut di hadapan TUHAN Pencipta kita",en:"Oh come, let us worship and bow down; let us kneel before the LORD, our Maker!"},{r:"PSA.96.1",ms:"Nyanyikanlah untuk TUHAN lagu baru; nyanyikanlah untuk TUHAN, seluruh bumi.",en:"Oh sing to the LORD a new song; sing to the LORD, all the earth!"},{r:"PSA.100.4",ms:"Masuklah ke pintu pagar-Nya dengan mengucap syukur dan ke pekarangan-Nya dengan pujian; bersyukurlah kepada-Nya, dan berkatilah nama-Nya.",en:"Enter his gates with thanksgiving, and his courts with praise! Give thanks to him; bless his name!"},{r:"PSA.100.5",ms:"Kerana TUHAN baik, kasih-Nya untuk selama-lamanya; dan kesetiaan-Nya kekal turun-temurun, zaman-berzaman.",en:"For the LORD is good; his steadfast love endures forever, and his faithfulness to all generations."},{r:"PSA.103.1",ms:"Pujilah TUHAN, wahai jiwaku; dan segala yang dalamku, pujilah nama-Nya yang suci.",en:"Bless the LORD, O my soul, and all that is within me, bless his holy name!"},{r:"PSA.103.2",ms:"Pujilah TUHAN, wahai jiwaku, dan jangan lupakan segala rahmat-Nya",en:"Bless the LORD, O my soul, and forget not all his benefits"},{r:"PSA.103.8",ms:"TUHAN penuh belas kasihan dan kasih kurnia, panjang sabar serta melimpah kasih-Nya.",en:"The LORD is merciful and gracious, slow to anger and abounding in steadfast love."},{r:"PSA.103.12",ms:"sebagaimana jauhnya timur dari barat, begitulah jauhnya Dia telah membuang keingkaran kita daripada diri kita.",en:"as far as the east is from the west, so far does he remove our transgressions from us."},{r:"PSA.106.1",ms:"Pujilah TUHAN! Bersyukurlah kepada TUHAN, kerana kebaikan-Nya; kerana kasih-Nya kekal selama-lamanya.",en:"Praise the LORD! Oh give thanks to the LORD, for he is good, for his steadfast love endures forever!"},{r:"PSA.107.1",ms:"Bersyukurlah kepada TUHAN, kerana kebaikan-Nya; kerana kasih-Nya kekal selama-lamanya.",en:"Oh give thanks to the LORD, for he is good, for his steadfast love endures forever!"},{r:"PSA.112.7",ms:"Dia tidak akan takut kepada berita buruk; hatinya teguh, percaya kepada TUHAN.",en:"He is not afraid of bad news; his heart is firm, trusting in the LORD."},{r:"PSA.118.6",ms:"TUHAN memihak kepadaku; aku tidak akan takut. Apakah yang dapat dilakukan manusia kepadaku?",en:"The LORD is on my side; I will not fear. What can man do to me?"},{r:"PSA.118.24",ms:"Ini hari yang dijadikan oleh TUHAN; kita akan bergembira dan bersukacita kerananya.",en:"This is the day that the LORD has made; let us rejoice and be glad in it."},{r:"PSA.119.11",ms:"Firman-Mu telah kusimpan baik-baik dalam hatiku supaya aku tidak berdosa terhadap-Mu.",en:"I have stored up your word in my heart, that I might not sin against you."},{r:"PSA.119.105",ms:"Firman-Mu lampu bagi kakiku dan cahaya bagi jalanku.",en:"Your word is a lamp to my feet and a light to my path."},{r:"PSA.119.114",ms:"Engkaulah perlindunganku dan perisaiku; aku menyandarkan harapan kepada firman-Mu.",en:"You are my hiding place and my shield; I hope in your word."},{r:"PSA.121.1",ms:"Aku mengangkat mataku ke bukit \u2014 dari manakah datangnya pertolongan untukku?",en:"I lift up my eyes to the hills. From where does my help come?"},{r:"PSA.121.2",ms:"Pertolongan untukku datang daripada TUHAN, yang menjadikan langit dan bumi.",en:"My help comes from the LORD, who made heaven and earth."},{r:"PSA.121.8",ms:"TUHAN akan melindungi pemergianmu dan kepulanganmu dari sekarang untuk selama-lamanya.",en:"The LORD will keep your going out and your coming in from this time forth and forevermore."},{r:"PSA.126.5",ms:"Mereka yang menyemai dengan air mata akan menuai dengan bahagia.",en:"Those who sow in tears shall reap with shouts of joy!"},{r:"PSA.127.1",ms:"Melainkan TUHAN mendirikan rumah, sia-sialah tenaga orang yang membinanya. Melainkan TUHAN menjaga kota, sia-sialah pengawal berjaga malam.",en:"Unless the LORD builds the house, those who build it labor in vain. Unless the LORD watches over the city, the watchman stays awake in vain."},{r:"PSA.133.1",ms:"Lihatlah, betapa baik dan menyenangkan hati apabila saudara-saudara seiman hidup bersama dengan bersatu-padu!",en:"Behold, how good and pleasant it is when brothers dwell in unity!"},{r:"PSA.136.1",ms:"Bersyukurlah kepada TUHAN, kerana Dia baik, kasih-Nya kekal selama-lamanya.",en:"Give thanks to the LORD, for he is good, for his steadfast love endures forever."},{r:"PSA.138.8",ms:"TUHAN akan menyempurnakan hal ehwalku; kasih-Mu, ya TUHAN, kekal selama-lamanya \u2014 janganlah tinggalkan hasil kerja tangan-Mu.",en:"The LORD will fulfill his purpose for me; your steadfast love, O LORD, endures forever. Do not forsake the work of your hands."},{r:"PSA.139.14",ms:"Aku akan memuji-Mu, kerana aku dicipta dengan mengagumkan dan menakjubkan; sungguh menakjubkan ciptaan-Mu, dan ini amat diketahui oleh jiwaku.",en:"I praise you, for I am fearfully and wonderfully made. Wonderful are your works; my soul knows it very well."},{r:"PSA.139.23",ms:"Telitilah aku, ya Allah, dan kenallah hatiku; dugalah aku dan ketahuilah kebimbanganku.",en:"Search me, O God, and know my heart! Try me and know my thoughts!"},{r:"PSA.143.8",ms:"Perdengarkanlah kasih setia-Mu kepadaku pada waktu pagi, kerana kepada-Mu kusandarkan kepercayaanku. Beritahulah aku jalan yang harus kuambil, kerana aku mengangkatkan jiwaku kepada-Mu.",en:"Let me hear in the morning of your steadfast love, for in you I trust. Make me know the way I should go, for to you I lift up my soul."},{r:"PSA.145.8",ms:"TUHAN penuh kasih kurnia dan belas kasihan, tidak cepat murka dan amat pengasihan.",en:"The LORD is gracious and merciful, slow to anger and abounding in steadfast love."},{r:"PSA.145.18",ms:"TUHAN dekat dengan semua yang menyeru-Nya, semua yang menyeru-Nya dalam kebenaran.",en:"The LORD is near to all who call on him, to all who call on him in truth."},{r:"PSA.147.3",ms:"Dia menyembuhkan mereka yang patah hati dan membalut luka mereka.",en:"He heals the brokenhearted and binds up their wounds."},{r:"PSA.150.6",ms:"Setiap yang bernafas, pujilah TUHAN. Pujilah TUHAN!",en:"Let everything that has breath praise the LORD! Praise the LORD!"},{r:"PRO.1.7",ms:"Takut kepada TUHAN adalah permulaan pengetahuan; orang bodoh meremehkan hikmah dan didikan.",en:"The fear of the LORD is the beginning of knowledge; fools despise wisdom and instruction."},{r:"PRO.3.3",ms:"Jangan biarkan kasih setia dan kebenaran meninggalkan kamu, kalungkannya di lehermu dan pahatkannya di loh hatimu.",en:"Let not steadfast love and faithfulness forsake you; bind them around your neck; write them on the tablet of your heart."},{r:"PRO.3.5",ms:"Percayalah kepada TUHAN dengan sepenuh hatimu dan janganlah bersandar kepada pengertianmu sendiri.",en:"Trust in the LORD with all your heart, and do not lean on your own understanding."},{r:"PRO.3.6",ms:"Ingatlah Dia dalam segala jalanmu, maka Dia akan meluruskan jalanmu.",en:"In all your ways acknowledge him, and he will make straight your paths."},{r:"PRO.3.9",ms:"Muliakanlah TUHAN dengan hartamu dan dengan hasil pertama daripada segala penghasilanmu",en:"Honor the LORD with your wealth and with the firstfruits of all your produce"},{r:"PRO.4.23",ms:"Jagalah hatimu lebih daripada segalanya, kerana dari situlah terpancar mata air kehidupan.",en:"Keep your heart with all vigilance, for from it flow the springs of life."},{r:"PRO.10.12",ms:"Kebencian menimbulkan perbalahan, tetapi kasih menutupi segala pelanggaran.",en:"Hatred stirs up strife, but love covers all offenses."},{r:"PRO.11.25",ms:"Jiwa yang suka beramal jariah akan diberi kelimpahan, orang yang memberikan air kepada orang, dia sendiri akan diberi minum.",en:"Whoever brings blessing will be enriched, and one who waters will himself be watered."},{r:"PRO.12.25",ms:"Kekhuatiran memberatkan hati, tetapi kata-kata yang baik menggembirakannya.",en:"Anxiety in a mans heart weighs him down, but a good word makes him glad."},{r:"PRO.14.30",ms:"Hati yang tenteram menyegarkan tubuh, tetapi hasad dengki mereputkan tulang.",en:"A tranquil heart gives life to the flesh, but envy makes the bones rot."},{r:"PRO.15.1",ms:"Jawapan yang lemah lembut meredakan murka, tetapi perkataan yang tajam membangkitkan amarah.",en:"A soft answer turns away wrath, but a harsh word stirs up anger."},{r:"PRO.16.3",ms:"Serahkanlah perbuatanmu kepada TUHAN, maka rancanganmu akan terlaksana.",en:"Commit your work to the LORD, and your plans will be established."},{r:"PRO.16.9",ms:"Hati manusia merancang jalannya, tetapi TUHAN sajalah yang menentukan langkahnya.",en:"The heart of man plans his way, but the LORD establishes his steps."},{r:"PRO.17.17",ms:"Seorang sahabat menaruh kasih setiap waktu, dan seorang saudara lahir untuk masa menghadapi kesukaran.",en:"A friend loves at all times, and a brother is born for adversity."},{r:"PRO.17.22",ms:"Hati yang gembira adalah ubat yang baik, tetapi semangat yang patah mengeringkan tulang.",en:"A joyful heart is good medicine, but a crushed spirit dries up the bones."},{r:"PRO.18.10",ms:"Nama TUHAN ialah menara yang kukuh, orang benar lari ke sana dan mendapat keselamatan.",en:"The name of the LORD is a strong tower; the righteous man runs into it and is safe."},{r:"PRO.19.17",ms:"Sesiapa mengasihani orang miskin memberikan pinjaman kepada TUHAN, dan Dia akan membalas jasa baiknya itu.",en:"Whoever is generous to the poor lends to the LORD, and he will repay him for his deed."},{r:"PRO.19.21",ms:"Ada banyak rancangan dalam hati manusia, tetapi keputusan TUHAN sajalah yang terlaksana.",en:"Many are the plans in the mind of a man, but it is the purpose of the LORD that will stand."},{r:"PRO.22.6",ms:"Didiklah seorang anak di jalan yang patut dilaluinya, maka pada masa tuanya pun dia tidak menyimpang dari laluan itu.",en:"Train up a child in the way he should go; even when he is old he will not depart from it."},{r:"PRO.27.17",ms:"Besi menajamkan besi, demikian juga orang menajamkan sesamanya.",en:"Iron sharpens iron, and one man sharpens another."},{r:"PRO.28.13",ms:"Orang yang menyembunyikan pelanggarannya tidak akan beruntung, tetapi sesiapa mengakui dan meninggalkannya akan mendapat rahmat.",en:"Whoever conceals his transgressions will not prosper, but he who confesses and forsakes them will obtain mercy."},{r:"PRO.30.5",ms:"Semua firman Allah teruji. Dia perisai bagi mereka yang berlindung kepada-Nya.",en:"Every word of God proves true; he is a shield to those who take refuge in him."},{r:"PRO.31.30",ms:"Daya tarikan memperdaya dan kecantikan cuma kesia-siaan, tetapi perempuan yang takut kepada TUHAN akan dipuji-puji.",en:"Charm is deceitful, and beauty is vain, but a woman who fears the LORD is to be praised."},{r:"LAM.3.22",ms:"Kerana kasih setia TUHAN tidak pernah lenyap, belas kasihan-Nya tidak akan pudar.",en:"The steadfast love of the LORD never ceases; his mercies never come to an end"},{r:"LAM.3.23",ms:"Semuanya baru setiap pagi. Besarnya kesetiaan-Mu!",en:"they are new every morning; great is your faithfulness."},{r:"LAM.3.24",ms:"\u201CTUHAN ialah Pusakaku,\u201D kata jiwaku, \u201Csebab itu aku berharap kepada-Nya.\u201D",en:"\u201CThe LORD is my portion,\u201D says my soul, \u201Ctherefore I will hope in him.\u201D"},{r:"LAM.3.25",ms:"TUHAN itu baik bagi orang yang menanti-nantikan Dia, bagi jiwa yang mencari hadirat-Nya.",en:"The LORD is good to those who wait for him, to the soul who seeks him."},{r:"LAM.3.26",ms:"Baik jika seseorang menanti dengan tenang akan penyelamatan daripada TUHAN.",en:"It is good that one should wait quietly for the salvation of the LORD."},{r:"LAM.3.40",ms:"Marilah kita memeriksa dan meneliti cara hidup kita, lalu kembali kepada TUHAN.",en:"Let us test and examine our ways, and return to the LORD!"},{r:"LAM.3.57",ms:"Pada waktu aku berseru kepada-Mu, Engkau datang mendekat. Firman-Mu, \u201CJangan takut!\u201D",en:"You came near when I called on you; you said, \u2018Do not fear!\u2019"},{r:"MAT.5.3",ms:"Diberkatilah mereka yang miskin kerohanian, kerana merekalah yang empunya kerajaan syurga.",en:"Blessed are the poor in spirit, for theirs is the kingdom of heaven."},{r:"MAT.5.6",ms:"Diberkatilah mereka yang lapar dan dahaga akan perbenaran, kerana mereka akan dipuaskan.",en:"Blessed are those who hunger and thirst for righteousness, for they shall be satisfied."},{r:"MAT.5.8",ms:"Diberkatilah mereka yang suci hati, kerana mereka akan melihat Allah.",en:"Blessed are the pure in heart, for they shall see God."},{r:"MAT.5.9",ms:"Diberkatilah mereka yang mendamaikan manusia, kerana mereka akan dipanggil anak-anak Allah.",en:"Blessed are the peacemakers, for they shall be called sons of God."},{r:"MAT.5.14",ms:"Kamu ialah cahaya dunia ini. Kota di atas bukit tidak mungkin tersembunyi.",en:"You are the light of the world. A city set on a hill cannot be hidden."},{r:"MAT.5.16",ms:"Biarlah cahayamu juga bersinar di hadapan orang ramai, supaya mereka melihat perbuatanmu yang baik lalu memuji Bapamu yang di syurga.",en:"In the same way, let your light shine before others, so that they may see your good works and give glory to your Father who is in heaven."},{r:"MAT.5.44",ms:"Tetapi sekarang Aku berkata kepadamu: Kasihilah musuhmu dan doakan orang yang menganiayamu.",en:"But I say to you, Love your enemies and pray for those who persecute you"},{r:"MAT.6.21",ms:"Kerana di mana hartamu terkumpul, di situlah hatimu tertumpu.",en:"For where your treasure is, there your heart will be also."},{r:"MAT.6.33",ms:"Utamakanlah kerajaan Allah serta perbenaran-Nya; dan semuanya itu akan diberikan kepadamu.",en:"But seek first the kingdom of God and his righteousness, and all these things will be added to you."},{r:"MAT.6.34",ms:"Oleh itu, jangan khuatir tentang hari esok, kerana hari esok akan khuatir tentang hal-halnya sendiri. Setiap hari sudah cukup dengan kesusahan sehari.",en:"Therefore do not be anxious about tomorrow, for tomorrow will be anxious for itself. Sufficient for the day is its own trouble."},{r:"MAT.7.7",ms:"Mintalah, dan kamu akan menerimanya; carilah, dan kamu akan mendapatnya; ketuklah pintu, dan pintu akan dibuka untukmu.",en:"Ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you."},{r:"MAT.7.12",ms:"Segala sesuatu yang kamu mahu orang lakukan kepadamu, lakukanlah demikian juga kepada mereka, kerana inilah ajaran Taurat dan nabi-nabi.",en:"So whatever you wish that others would do to you, do also to them, for this is the Law and the Prophets."},{r:"MAT.11.28",ms:"Marilah ke sisi-Ku, wahai semua yang jerih lelah dan memikul beban berat; Aku akan memberimu kelegaan.",en:"Come to me, all who labor and are heavy laden, and I will give you rest."},{r:"MAT.11.29",ms:"Ambillah kuk daripada-Ku dan terimalah ajaran-Ku, kerana Aku ini lemah lembut dan rendah hati, maka jiwamu akan tenang.",en:"Take my yoke upon you, and learn from me, for I am gentle and lowly in heart, and you will find rest for your souls."},{r:"MAT.18.20",ms:"kerana apabila dua atau tiga orang berhimpun dalam nama-Ku, Aku ada di situ bersama mereka.",en:"For where two or three are gathered in my name, there am I among them."},{r:"MAT.19.26",ms:"Sambil memandang mereka Yesus menjawab, \u201CHal itu mustahil bagi manusia, tetapi bagi Allah tidak ada satu pun yang mustahil.\u201D",en:"But Jesus looked at them and said, \u201CWith man this is impossible, but with God all things are possible.\u201D"},{r:"MAT.22.37",ms:"Yesus menjawab,  \u2018Kasihilah Tuhan, Allahmu, dengan sepenuh hatimu, dengan sepenuh jiwamu dan dengan sepenuh fikiranmu.\u2019",en:"And he said to him, You shall love the Lord your God with all your heart and with all your soul and with all your mind."},{r:"MAT.22.39",ms:"Perintah kedua sama pentingnya: \u2018Kasihilah sesama manusia sebagaimana kamu mengasihi dirimu sendiri.\u2019",en:"And a second is like it: You shall love your neighbor as yourself."},{r:"MAT.28.19",ms:"Oleh itu pergilah, jadikan semua bangsa murid-Ku. Baptislah mereka dengan nama Bapa, Anak dan Roh Kudus.",en:"Go therefore and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit"},{r:"MAT.28.20",ms:"Ajarlah mereka supaya taat akan segala perkara yang telah Kuperintahkan kepadamu. Aku akan sentiasa bersamamu, hingga ke akhir zaman.",en:"teaching them to observe all that I have commanded you. And behold, I am with you always, to the end of the age."},{r:"MRK.9.23",ms:"Yesus berkata kepadanya, \u201CApa katamu? Kalau Engkau dapat? Segala sesuatu mungkin bagi orang yang percaya.\u201D",en:"And Jesus said to him, \u201C\u2018If you can\u2019! All things are possible for one who believes.\u201D"},{r:"MRK.10.27",ms:"Sambil memandang mereka Yesus menjawab, \u201CBagi manusia hal itu mustahil, tetapi tidak bagi Allah; tidak ada satu pun yang mustahil bagi Allah.\u201D",en:"Jesus looked at them and said, \u201CWith man it is impossible, but not with God. For all things are possible with God.\u201D"},{r:"MRK.10.45",ms:"Demikianlah Anak Manusia juga datang bukan untuk dilayan tetapi untuk melayan, dan untuk menyerahkan nyawa-Nya sebagai tebusan bagi ramai orang.",en:"For even the Son of Man came not to be served but to serve, and to give his life as a ransom for many."},{r:"MRK.11.24",ms:"Oleh itu, Aku berkata kepadamu, apa sahaja yang kamu minta dalam doa, percayalah kamu akan menerimanya, maka kamu akan mendapatnya.",en:"Therefore I tell you, whatever you ask in prayer, believe that you have received it, and it will be yours."},{r:"MRK.11.25",ms:"Setiap kali kamu berdoa, jika ada sesiapa yang bersalah terhadapmu, ampunilah dia, supaya Bapamu di syurga juga akan mengampunkan kesalahanmu.",en:"And whenever you stand praying, forgive, if you have anything against anyone, so that your Father also who is in heaven may forgive you your trespasses."},{r:"MRK.12.30",ms:"Kasihilah Tuhan, Allahmu, dengan sepenuh hatimu, dengan sepenuh jiwamu, dengan sepenuh fikiranmu, dan dengan sepenuh kekuatanmu. Inilah perintah yang terutama.",en:"And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength."},{r:"MRK.16.15",ms:"Dia berkata kepada mereka, Pergilah ke serata dunia dan sebarkan Injil kepada setiap insan.",en:"And he said to them, Go into all the world and proclaim the gospel to the whole creation."},{r:"LUK.1.37",ms:"Sebabnya bagi Allah tidak ada yang mustahil.",en:"For nothing will be impossible with God."},{r:"LUK.2.11",ms:"Pada malam ini di kota Daud telah lahir seorang Penyelamat bagimu, iaitu Kristus, Tuhan.",en:"For unto you is born this day in the city of David a Savior, who is Christ the Lord."},{r:"LUK.6.31",ms:"Apa yang kamu mahu orang lakukan kepadamu, lakukanlah demikian juga kepada mereka.",en:"And as you wish that others would do to you, do so to them."},{r:"LUK.6.36",ms:"Kamu hendaklah berbelas kasihan seperti Bapamu yang berbelas kasihan.",en:"Be merciful, even as your Father is merciful."},{r:"LUK.11.9",ms:"Oleh itu, Aku berkata kepadamu: Mintalah, dan kamu akan menerimanya; carilah, dan kamu akan mendapatnya; ketuklah pintu, dan pintu akan dibuka untukmu.",en:"And I tell you, ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you."},{r:"LUK.12.7",ms:"Malahan setiap helai rambut di kepalamu telah dihitung. Oleh itu, usahlah takut; kamu lebih berharga daripada banyak burung pipit.",en:"Why, even the hairs of your head are all numbered. Fear not; you are of more value than many sparrows."},{r:"LUK.12.34",ms:"Kerana di mana hartamu terkumpul, di situlah hatimu tertumpu.",en:"For where your treasure is, there will your heart be also."},{r:"LUK.18.27",ms:"Yesus menjawab, \u201CApa yang mustahil bagi manusia itu tidak mustahil bagi Allah.\u201D",en:"But he said, \u201CWhat is impossible with man is possible with God.\u201D"},{r:"LUK.19.10",ms:"Anak Manusia datang untuk mencari dan menyelamatkan orang yang hilang.",en:"For the Son of Man came to seek and to save the lost."},{r:"JHN.1.1",ms:"Pada permulaan sudah wujud Firman, dan Firman itu bersama Allah dan Firman itu ialah Allah.",en:"In the beginning was the Word, and the Word was with God, and the Word was God."},{r:"JHN.1.12",ms:"Namun demikian, Dia memberikan hak menjadi anak Allah kepada mereka yang menerima-Nya dan percaya dalam nama-Nya.",en:"But to all who did receive him, who believed in his name, he gave the right to become children of God"},{r:"JHN.1.14",ms:"Firman itu menjadi manusia dan hidup dalam kalangan kita. Kita telah melihat kemuliaan-Nya sebagai Anak Tunggal yang datang daripada Bapa, penuh dengan kasih kurnia dan kebenaran.",en:"And the Word became flesh and dwelt among us, and we have seen his glory, glory as of the only Son from the Father, full of grace and truth."},{r:"JHN.3.16",ms:"Allah begitu mengasihi dunia sehingga menganugerahkan Anak-Nya yang tunggal supaya setiap orang yang percaya kepada-Nya tidak binasa melainkan mendapat hidup kekal.",en:"For God so loved the world, that he gave his only Son, that whoever believes in him should not perish but have eternal life."},{r:"JHN.3.17",ms:"Allah mengutus Anak-Nya ke dunia bukan untuk menghakimi dunia tetapi supaya melalui Dia, dunia ini diselamatkan.",en:"For God did not send his Son into the world to condemn the world, but in order that the world might be saved through him."},{r:"JHN.4.24",ms:"Allah itu Roh, maka orang yang menyembah Dia harus menyembah-Nya dalam roh dan kebenaran.",en:"God is spirit, and those who worship him must worship in spirit and truth."},{r:"JHN.6.35",ms:"Yesus berkata kepada mereka, Akulah roti hidup itu. Sesiapa yang datang kepada-Ku tidak akan lapar lagi, dan sesiapa yang percaya kepada-Ku tidak akan dahaga lagi.",en:"Jesus said to them, I am the bread of life; whoever comes to me shall not hunger, and whoever believes in me shall never thirst."},{r:"JHN.8.12",ms:"Yesus berkata lagi kepada mereka, \u201CAkulah cahaya dunia. Orang yang mengikut-Ku tidak akan berjalan dalam kegelapan tetapi akan mempunyai cahaya hidup.\u201D",en:"Again Jesus spoke to them, saying, \u201CI am the light of the world. Whoever follows me will not walk in darkness, but will have the light of life.\u201D"},{r:"JHN.8.32",ms:"Maka kamu akan mengenal kebenaran dan kebenaran akan membebaskanmu.",en:"and you will know the truth, and the truth will set you free."},{r:"JHN.10.10",ms:"Pencuri datang untuk mencuri, membunuh dan membinasakan. Tetapi Aku datang supaya manusia mempunyai hidup bahkan mempunyai hidup yang berlimpah-limpah.",en:"The thief comes only to steal and kill and destroy. I came that they may have life and have it abundantly."},{r:"JHN.10.11",ms:"Akulah gembala yang baik. Gembala yang baik mengorbankan nyawanya untuk kawanan dombanya.",en:"I am the good shepherd. The good shepherd lays down his life for the sheep."},{r:"JHN.11.25",ms:"Yesus berkata kepada Marta, Akulah kebangkitan dan hidup. Sesiapa yang percaya kepada-Ku akan hidup, meskipun dia sudah mati.",en:"Jesus said to her, I am the resurrection and the life. Whoever believes in me, though he die, yet shall he live"},{r:"JHN.13.34",ms:"Inilah perintah baru yang Kuberikan kepadamu: Kasihilah satu sama lain. Sebagaimana Aku telah mengasihimu, kasihilah sesama sendiri.",en:"A new commandment I give to you, that you love one another: just as I have loved you, you also are to love one another."},{r:"JHN.13.35",ms:"Daripada sikapmu yang saling mengasihi itu, semua orang akan tahu bahawa kamu murid-Ku.",en:"By this all people will know that you are my disciples, if you have love for one another."},{r:"JHN.14.1",ms:"Janganlah resah hatimu. Percayalah kepada Allah dan percayalah juga kepada-Ku.",en:"Let not your hearts be troubled. Believe in God; believe also in me."},{r:"JHN.14.6",ms:"Yesus menjawab, Akulah jalan, kebenaran dan hidup. Tiada seorang pun datang kepada Bapa kecuali melalui-Ku.",en:"Jesus said to him, I am the way, and the truth, and the life. No one comes to the Father except through me."},{r:"JHN.14.15",ms:"Jika kamu mengasihi-Ku, kamu akan mematuhi perintah-perintah-Ku.",en:"If you love me, you will keep my commandments."},{r:"JHN.14.27",ms:"Sejahtera Kutinggalkan bagimu. Sejahtera-Ku sendiri Kuberikan kepadamu. Apa yang Kuberikan kepadamu bukan seperti yang disogokkan oleh dunia. Janganlah resah hatimu dan janganlah takut.",en:"Peace I leave with you; my peace I give to you. Not as the world gives do I give to you. Let not your hearts be troubled, neither let them be afraid."},{r:"JHN.15.5",ms:"Aku pokok anggur dan kamu ranting-rantingnya. Jika kamu tetap di dalam-Ku dan Aku di dalammu, kamu akan berbuah lebat. Tanpa-Ku, kamu tidak dapat menghasilkan apa-apa.",en:"I am the vine; you are the branches. Whoever abides in me and I in him, he it is that bears much fruit, for apart from me you can do nothing."},{r:"JHN.15.7",ms:"Sekiranya kamu tetap di dalam-Ku, dan kata-kata-Ku tetap di dalammu, mintalah apa sahaja yang kamu kehendaki, permohonan itu akan dikabulkan.",en:"If you abide in me, and my words abide in you, ask whatever you wish, and it will be done for you."},{r:"JHN.15.12",ms:"Inilah perintah-Ku: Kasihilah sesama sendiri, seperti Aku mengasihimu.",en:"This is my commandment, that you love one another as I have loved you."},{r:"JHN.15.13",ms:"Tiada kasih yang lebih besar daripada kasih seorang yang mengorbankan nyawanya untuk sahabatnya.",en:"Greater love has no one than this, that someone lay down his life for his friends."},{r:"JHN.16.33",ms:"Segala ini Kukatakan kepadamu supaya kamu beroleh sejahtera di dalam Aku. Di dalam dunia kamu akan menghadapi penderitaan; tetapi tegapkanlah hatimu, kerana Aku telah menewaskan dunia.",en:"I have said these things to you, that in me you may have peace. In the world you will have tribulation. But take heart; I have overcome the world."},{r:"JHN.20.29",ms:"Yesus berkata kepadanya, \u201CTomas, oleh sebab kamu telah melihat-Ku maka kamu percaya. Diberkatilah orang yang percaya walaupun tidak melihat-Ku!\u201D",en:"Jesus said to him, \u201CHave you believed because you have seen me? Blessed are those who have not seen and yet have believed.\u201D"},{r:"ACT.1.8",ms:"Tetapi kamu akan menerima kuasa apabila Roh Kudus datang ke atasmu; dan kamu akan menjadi saksi-Ku di Yerusalem, di seluruh Yudea dan Samaria, bahkan sampai ke hujung bumi.",en:"But you will receive power when the Holy Spirit has come upon you, and you will be my witnesses in Jerusalem and in all Judea and Samaria, and to the end of the earth."},{r:"ACT.2.42",ms:"Mereka berpegang teguh pada pengajaran para rasul, dan pada persaudaraan, pembahagian roti dan doa.",en:"And they devoted themselves to the apostles teaching and the fellowship, to the breaking of bread and the prayers."},{r:"ACT.4.12",ms:"Tiadalah penyelamatan melalui sesiapa yang lain, kerana tiada nama lain di bawah langit ini diberikan dalam kalangan manusia, yang dapat menyelamatkan kita.",en:"And there is salvation in no one else, for there is no other name under heaven given among men by which we must be saved."},{r:"ACT.16.31",ms:"Mereka menjawab, \u201CPercayalah kepada Tuhan Yesus, dan kamu akan diselamatkan, kamu dan seisi rumahmu.\u201D",en:"And they said, \u201CBelieve in the Lord Jesus, and you will be saved, you and your household.\u201D"},{r:"ROM.1.16",ms:"Aku tidak teragak-agak menyebarkan Injil, kerana Injil adalah kuasa daripada Allah untuk menyelamatkan setiap orang yang beriman, mula-mula kepada orang Yahudi kemudian kepada orang Yunani.",en:"For I am not ashamed of the gospel, for it is the power of God for salvation to everyone who believes, to the Jew first and also to the Greek."},{r:"ROM.3.23",ms:"Kerana semua manusia telah berdosa dan tidak dapat mencapai kemuliaan Allah.",en:"for all have sinned and fall short of the glory of God"},{r:"ROM.5.1",ms:"Oleh yang demikian, kerana kita telah diperbenar melalui iman, kita telah berdamai dengan Allah melalui Tuhan kita Yesus Kristus.",en:"Therefore, since we have been justified by faith, we have peace with God through our Lord Jesus Christ."},{r:"ROM.5.5",ms:"Dan harapan tidak mengecewakan kita, kerana Allah telah mencurahkan kasih-Nya ke dalam hati kita melalui Roh Kudus, yang telah dikurniakan-Nya kepada kita.",en:"and hope does not put us to shame, because Gods love has been poured into our hearts through the Holy Spirit who has been given to us."},{r:"ROM.5.8",ms:"Tetapi Allah telah menunjukkan kasih-Nya sendiri terhadap kita dengan demikian: Ketika kita masih berdosa, Kristus telah mati untuk kita.",en:"but God shows his love for us in that while we were still sinners, Christ died for us."},{r:"ROM.6.23",ms:"Kerana ganjaran dosa ialah kematian tetapi kurnia Allah ialah kehidupan kekal dalam Kristus Yesus, Tuhan kita.",en:"For the wages of sin is death, but the free gift of God is eternal life in Christ Jesus our Lord."},{r:"ROM.8.1",ms:"Dengan demikian, sekarang tidak ada hukuman bagi orang yang ada dalam Kristus Yesus.",en:"There is therefore now no condemnation for those who are in Christ Jesus."},{r:"ROM.8.18",ms:"Aku menganggap bahawa penderitaan kita sekarang terlalu kecil untuk dibandingkan dengan kemuliaan yang akan dinyatakan kepada kita.",en:"For I consider that the sufferings of this present time are not worth comparing with the glory that is to be revealed to us."},{r:"ROM.8.28",ms:"Dan kita tahu bahawa dalam semua hal Allah bekerja untuk kebaikan orang yang mengasihi-Nya, yang telah dipanggil menurut rancangan-Nya.",en:"And we know that for those who love God all things work together for good, for those who are called according to his purpose."},{r:"ROM.8.31",ms:"Jadi, apakah yang akan kita katakan sebagai sambutan kepada hal ini? Jika Allah memihak kepada kita, siapa dapat melawan kita?",en:"What then shall we say to these things? If God is for us, who can be against us?"},{r:"ROM.8.37",ms:"Tidak! Dalam semua hal ini kita lebih daripada para penakluk melalui Dia yang mengasihi kita.",en:"No, in all these things we are more than conquerors through him who loved us."},{r:"ROM.8.38",ms:"Kerana aku yakin bahawa kematian mahupun kehidupan, para malaikat mahupun para pemerintah, masa kini mahupun masa depan, baik kuasa apa pun",en:"For I am sure that neither death nor life, nor angels nor rulers, nor things present nor things to come, nor powers"},{r:"ROM.8.39",ms:"ketinggian mahupun kedalaman, baik apa pun yang lain dalam seluruh ciptaan, tidak akan dapat memisahkan kita daripada kasih Allah yang di dalam Kristus Yesus, Tuhan kita.",en:"nor height nor depth, nor anything else in all creation, will be able to separate us from the love of God in Christ Jesus our Lord."},{r:"ROM.10.9",ms:"Jika kamu akui dengan mulutmu bahawa Yesus ialah Tuhan dan percaya dalam hatimu bahawa Allah telah membangkitkan-Nya daripada kematian, kamu akan diselamatkan",en:"because, if you confess with your mouth that Jesus is Lord and believe in your heart that God raised him from the dead, you will be saved."},{r:"ROM.10.17",ms:"Oleh itu, iman datang daripada mendengar perkhabaran itu, dan perkhabaran itu didengar melalui sabda Kristus.",en:"So faith comes from hearing, and hearing through the word of Christ."},{r:"ROM.12.10",ms:"Hendaklah kamu bersikap baik dan mengasihi sesama sendiri dengan kasih persaudaraan, serta saling menghormati dan mengutamakan",en:"Love one another with brotherly affection. Outdo one another in showing honor."},{r:"ROM.12.12",ms:"Bergembiralah dalam harapan, tabah menghadapi kesusahan, dan terus-menerus berdoa.",en:"Rejoice in hope, be patient in tribulation, be constant in prayer."},{r:"ROM.12.18",ms:"Setakat yang mungkin, jika dalam keupayaanmu, hiduplah dalam damai dengan semua manusia.",en:"If possible, so far as it depends on you, live peaceably with all."},{r:"ROM.12.21",ms:"Jangan ditewaskan oleh kejahatan, tetapi tewaskanlah kejahatan dengan kebaikan.",en:"Do not be overcome by evil, but overcome evil with good."},{r:"ROM.13.8",ms:"Jangan berasa terhutang apa-apa kepada sesiapa pun kecuali kasih-mengasihi, kerana seseorang yang mengasihi sesama manusia telah memenuhi hukum",en:"Owe no one anything, except to love each other, for the one who loves another has fulfilled the law."},{r:"ROM.15.4",ms:"Segala yang tersurat pada masa dahulu adalah untuk menjadi pengajaran kepada kita, supaya melalui kesabaran dan penghiburan daripada Kitab Suci itu kita mendapat harapan.",en:"For whatever was written in former days was written for our instruction, that through endurance and through the encouragement of the Scriptures we might have hope."},{r:"ROM.15.13",ms:"Semoga Allah, sumber harapan, memenuhi hatimu dengan kegembiraan dan kesejahteraan dalam iman, supaya kamu dilimpahi harapan dengan kuasa Roh Kudus.",en:"May the God of hope fill you with all joy and peace in believing, so that by the power of the Holy Spirit you may abound in hope."},{r:"1CO.6.19",ms:"Kamu tentu tahu bahawa tubuhmu itu tempat kediaman Roh Kudus yang telah dikurniakan Allah kepadamu. Tubuhmu bukanlah milikmu, tetapi milik Allah.",en:"Or do you not know that your body is a temple of the Holy Spirit within you, whom you have from God? You are not your own"},{r:"1CO.10.31",ms:"Setiap yang kamu lakukan, baik makan mahupun minum, lakukanlah untuk memuliakan Allah.",en:"So, whether you eat or drink, or whatever you do, do all to the glory of God."},{r:"1CO.13.4",ms:"Kasih itu penyabar dan penyayang. Kasih tidak iri hati, tidak membanggakan diri, dan tidak angkuh.",en:"Love is patient and kind; love does not envy or boast; it is not arrogant"},{r:"1CO.13.7",ms:"Kasih tahan menderita segala-galanya, percaya akan segala-galanya, berharap akan segala-galanya, terus-menerus menanggung segala-galanya.",en:"Love bears all things, believes all things, hopes all things, endures all things."},{r:"1CO.13.13",ms:"Hanya tiga yang tinggal: iman, harapan dan kasih. Antara ketiga-tiga ini, yang paling utama ialah kasih.",en:"So now faith, hope, and love abide, these three; but the greatest of these is love."},{r:"1CO.15.57",ms:"Tetapi syukurlah kepada Allah yang telah memberi kita kemenangan melalui Tuhan kita Yesus Kristus.",en:"But thanks be to God, who gives us the victory through our Lord Jesus Christ."},{r:"1CO.16.13",ms:"Berhati-hatilah, berdiri teguh dalam iman, sentiasa berani dan gigih.",en:"Be watchful, stand firm in the faith, act like men, be strong."},{r:"1CO.16.14",ms:"Lakukan segala-galanya dalam kasih.",en:"Let all that you do be done in love."},{r:"2CO.1.3",ms:"Segala puji bagi Allah, Bapa Tuhan kita Yesus Kristus, Bapa Yang Maha Pemurah dan Allah sumber segala penghiburan.",en:"Blessed be the God and Father of our Lord Jesus Christ, the Father of mercies and God of all comfort"},{r:"2CO.4.16",ms:"Dengan demikian, kami tidak tawar hati. Walaupun manusia lahiriah kami kian merosot, namun manusia batiniah kami diperbaharu setiap hari.",en:"So we do not lose heart. Though our outer self is wasting away, our inner self is being renewed day by day."},{r:"2CO.4.18",ms:"Kami tidak mementingkan hal-hal yang kelihatan, tetapi hal-hal yang tidak kelihatan; kerana yang kelihatan itu cuma sedetik, manakala yang tidak kelihatan itu kekal.",en:"as we look not to the things that are seen but to the things that are unseen. For the things that are seen are transient, but the things that are unseen are eternal."},{r:"2CO.5.7",ms:"Sebabnya kami hidup dengan iman, bukan dengan penglihatan.",en:"for we walk by faith, not by sight."},{r:"2CO.5.17",ms:"Sesiapa yang ada dalam Kristus adalah ciptaan baru. Hal-hal lama telah lenyap dan segala-galanya baru.",en:"Therefore, if anyone is in Christ, he is a new creation. The old has passed away; behold, the new has come."},{r:"2CO.9.7",ms:"Masing-masing hendaklah memberi setulus hati, jangan dengan rasa enggan atau terpaksa, kerana Allah mengasihi orang yang memberi dengan gembira.",en:"Each one must give as he has decided in his heart, not reluctantly or under compulsion, for God loves a cheerful giver."},{r:"GAL.5.22",ms:"Sebaliknya, buah Roh ialah kasih, sukacita, damai sejahtera, kesabaran, kemurahan, kebaikan, kesetiaan",en:"But the fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faithfulness"},{r:"GAL.5.23",ms:"lemah lembut dan penguasaan diri. Tiada hukum yang menentang segala ini.",en:"gentleness, self-control; against such things there is no law."},{r:"GAL.6.2",ms:"Tanggung-menanggunglah beban satu sama lain, dan dengan demikian laksanakan hukum Kristus.",en:"Bear one anothers burdens, and so fulfill the law of Christ."},{r:"GAL.6.9",ms:"Janganlah kita jemu berbuat baik, kerana pada musimnya nanti kita akan menuai jika kita tidak berputus asa.",en:"And let us not grow weary of doing good, for in due season we will reap, if we do not give up."},{r:"EPH.2.8",ms:"Kamu telah diselamatkan dengan kasih kurnia-Nya melalui iman \u2014 ini bukan daripada kamu sendiri tetapi adalah kurnia Allah",en:"For by grace you have been saved through faith. And this is not your own doing; it is the gift of God"},{r:"EPH.2.10",ms:"Kerana kita ini buatan-Nya, dicipta dalam Kristus Yesus untuk melakukan perbuatan baik, yang telah disediakan terdahulu oleh Allah untuk kita lakukan.",en:"For we are his workmanship, created in Christ Jesus for good works, which God prepared beforehand, that we should walk in them."},{r:"EPH.3.20",ms:"Kepada Allah yang berkuasa melakukan segala-galanya dengan limpah kurnia melebihi permintaan dan sangkaan kita, menurut kuasa-Nya yang bertindak dalam diri kita",en:"Now to him who is able to do far more abundantly than all that we ask or think, according to the power at work within us"},{r:"EPH.4.2",ms:"Kamu haruslah selalu rendah hati dan lemah lembut; sabar, bertolak ansur satu sama lain dalam kasih",en:"with all humility and gentleness, with patience, bearing with one another in love"},{r:"EPH.4.26",ms:"\u201CApabila kamu marah, janganlah sampai melakukan dosa.\u201D Jangan kekalkan kemarahanmu hingga matahari terbenam",en:"Be angry and do not sin; do not let the sun go down on your anger"},{r:"EPH.4.29",ms:"Janganlah biarkan kata-kata yang kesat keluar dari mulutmu, tetapi lafazkanlah teguran baik yang membina, mengikut keperluannya, supaya membawa berkat kepada yang mendengar.",en:"Let no corrupting talk come out of your mouths, but only such as is good for building up, as fits the occasion, that it may give grace to those who hear."},{r:"EPH.4.32",ms:"Dan berbelas kasihlah satu sama lain, bersikap baik, saling memaafkan, sebagaimana Allah telah mengampunimu dalam Kristus.",en:"Be kind to one another, tenderhearted, forgiving one another, as God in Christ forgave you."},{r:"EPH.5.2",ms:"Hiduplah dalam kasih, sebagaimana Kristus mengasihi kita dan menyerahkan diri-Nya untuk kita sebagai persembahan dan korban yang harum bagi Allah.",en:"And walk in love, as Christ loved us and gave himself up for us, a fragrant offering and sacrifice to God."},{r:"EPH.6.10",ms:"Akhir kata, saudara-saudaraku, hendaklah kamu kuat dalam Tuhan dan dalam kekuatan kuasa-Nya.",en:"Finally, be strong in the Lord and in the strength of his might."},{r:"EPH.6.11",ms:"Pakailah selengkap senjata Allah, supaya kamu dapat bertahan terhadap tipu daya iblis.",en:"Put on the whole armor of God, that you may be able to stand against the schemes of the devil."},{r:"PHP.1.6",ms:"Aku yakin bahawa Allah yang telah memulakan suatu pekerjaan yang baik dalam dirimu akan menyudahkannya hingga hari Yesus Kristus.",en:"And I am sure of this, that he who began a good work in you will bring it to completion at the day of Jesus Christ."},{r:"PHP.1.21",ms:"Kerana bagiku, hidup ialah Kristus, dan mati ialah keuntungan.",en:"For to me to live is Christ, and to die is gain."},{r:"PHP.2.3",ms:"Janganlah lakukan apa pun kerana kepentingan diri sendiri atau keangkuhan. Dalam kerendahan hati biarlah setiap orang menganggap yang lain lebih tinggi daripada dirinya.",en:"Do nothing from selfish ambition or conceit, but in humility count others more significant than yourselves."},{r:"PHP.2.4",ms:"Tiap-tiap seorang daripada kamu janganlah menjaga kepentingan diri sahaja, jagalah juga kepentingan orang lain.",en:"Let each of you look not only to his own interests, but also to the interests of others."},{r:"PHP.3.14",ms:"aku terus berusaha ke arah matlamat mendapatkan ganjaran, iaitu panggilan Allah ke syurga dalam Kristus Yesus.",en:"I press on toward the goal for the prize of the upward call of God in Christ Jesus."},{r:"PHP.4.4",ms:"Bersukacitalah dalam Tuhan sentiasa. Kukatakan lagi: Bersukacitalah!",en:"Rejoice in the Lord always; again I will say, rejoice."},{r:"PHP.4.6",ms:"Jangan bimbangkan apa pun. Dalam segala hal, dengan berdoa dan memohon, dengan mengucapkan kesyukuran, beritahulah hasratmu kepada Allah.",en:"do not be anxious about anything, but in everything by prayer and supplication with thanksgiving let your requests be made known to God."},{r:"PHP.4.7",ms:"Dan sejahtera Allah yang melebihi pengertian manusia akan memelihara hati dan fikiranmu dalam Kristus Yesus.",en:"And the peace of God, which surpasses all understanding, will guard your hearts and your minds in Christ Jesus."},{r:"PHP.4.13",ms:"Aku dapat melakukan segalanya melalui Kristus yang memberiku kekuatan.",en:"I can do all things through him who strengthens me."},{r:"PHP.4.19",ms:"Allahku akan membekalkan segala keperluanmu daripada kekayaan-Nya yang termulia dalam Kristus Yesus.",en:"And my God will supply every need of yours according to his riches in glory in Christ Jesus."},{r:"COL.2.6",ms:"Oleh sebab kamu telah menerima Kristus Yesus sebagai Tuhan, hiduplah melangkah dalam Dia",en:"Therefore, as you received Christ Jesus the Lord, so walk in him"},{r:"COL.3.2",ms:"Tumpukan pemikiranmu kepada hal-hal di syurga, bukan hal-hal di bumi.",en:"Set your minds on things that are above, not on things that are on earth."},{r:"COL.3.12",ms:"Sebagai orang pilihan Allah yang suci dan amat dikasihi-Nya kamu haruslah bersifat belas kasih, baik budi, rendah hati, lemah lembut dan sabar.",en:"Put on then, as Gods chosen ones, holy and beloved, compassionate hearts, kindness, humility, meekness, and patience"},{r:"COL.3.15",ms:"Biarlah damai Kristus menguasai hatimu. Kamu telah dipanggil untuk mendapat damai itu dalam satu tubuh. Kamu haruslah bersyukur.",en:"And let the peace of Christ rule in your hearts, to which indeed you were called in one body. And be thankful."},{r:"COL.3.17",ms:"Segala yang kamu katakan dan lakukan haruslah dengan nama Tuhan Yesus sambil mengucap syukur kepada Bapa kita Allah melalui-Nya.",en:"And whatever you do, in word or deed, do everything in the name of the Lord Jesus, giving thanks to God the Father through him."},{r:"COL.3.23",ms:"Lakukan segala kerja dengan sebulat hatimu untuk Tuhan, bukan untuk manusia",en:"Whatever you do, work heartily, as for the Lord and not for men"},{r:"COL.4.2",ms:"Bertekunlah dalam doa dan berjaga-jaga serta mengucap syukur.",en:"Continue steadfastly in prayer, being watchful in it with thanksgiving."},{r:"1TH.5.11",ms:"Oleh yang demikian, hendaklah kamu saling menggalakkan dan meneguhkan, sebagaimana yang kamu lakukan sekarang.",en:"Therefore encourage one another and build one another up, just as you are doing."},{r:"1TH.5.16",ms:"Bersukacitalah sentiasa.",en:"Rejoice always"},{r:"1TH.5.17",ms:"Berdoalah sepanjang masa.",en:"pray without ceasing"},{r:"1TH.5.18",ms:"Bersyukurlah dalam segala keadaan kerana inilah yang dikehendaki Allah daripadamu dalam Kristus Yesus.",en:"give thanks in all circumstances; for this is the will of God in Christ Jesus for you."},{r:"2TH.3.3",ms:"Tetapi Tuhan setia dan akan menguatkan kamu serta melindungimu daripada si durjana.",en:"But the Lord is faithful. He will establish you and guard you against the evil one."},{r:"2TH.3.16",ms:"Semoga Tuhan, sumber segala kesejahteraan, sentiasa mengurniaimu kesejahteraan dalam segala hal. Tuhan bersama kamu semua.",en:"Now may the Lord of peace himself give you peace at all times in every way. The Lord be with you all."},{r:"1TI.4.12",ms:"Jangan biarkan sesiapa menghinamu kerana usiamu yang muda. Jadikan dirimu teladan kepada semua orang beriman dari segi kata-kata, kelakuan, kasih, iman dan kesucian.",en:"Let no one despise you for your youth, but set the believers an example in speech, in conduct, in love, in faith, in purity."},{r:"1TI.6.6",ms:"Kesalihan yang disertai dengan rasa puas membawa keuntungan besar.",en:"But godliness with contentment is great gain"},{r:"2TI.1.7",ms:"Allah tidak memberi kita roh ketakutan, tetapi kuasa, kasih dan tatatertib.",en:"for God gave us a spirit not of fear but of power and love and self-control."},{r:"2TI.2.15",ms:"Berusahalah supaya ternyata kamu diredai Allah, seorang pekerja yang tidak perlu berasa malu, yang menyebarkan kebenaran dengan sewajarnya.",en:"Do your best to present yourself to God as one approved, a worker who has no need to be ashamed, rightly handling the word of truth."},{r:"2TI.3.16",ms:"Seluruh Kitab Suci diilhamkan oleh Allah, dan berguna untuk mengajar, menegur, membetulkan dan mendidik ke arah kebenaran.",en:"All Scripture is breathed out by God and profitable for teaching, for reproof, for correction, and for training in righteousness"},{r:"2TI.4.7",ms:"Aku telah berjuang dalam perjuangan mulia ini, aku telah sampai ke garis akhir, aku telah setia dalam iman.",en:"I have fought the good fight, I have finished the race, I have kept the faith."},{r:"TIT.2.11",ms:"Hal ini demikian kerana kasih kurnia Allah yang menyelamatkan seluruh umat manusia telah nyata.",en:"For the grace of God has appeared, bringing salvation for all people"},{r:"PHM.1.6",ms:"Aku berdoa semoga persaudaraan kita sebagai orang yang beriman kepada Kristus akan membawa pengertian yang lebih mendalam tentang segala yang baik yang kita miliki dalam Kristus.",en:"and I pray that the sharing of your faith may become effective for the full knowledge of every good thing that is in us for the sake of Christ."},{r:"HEB.4.16",ms:"Oleh itu, marilah kita tampil dengan berani ke hadapan takhta kasih kurnia, supaya kita mendapat belas kasihan dan kasih kurnia untuk menolong kita ketika kita memerlukannya.",en:"Let us then with confidence draw near to the throne of grace, that we may receive mercy and find grace to help in time of need."},{r:"HEB.10.23",ms:"Marilah kita berpegang teguh pada pengakuan harapan kita tanpa berganjak, kerana Dia yang berjanji sentiasa setia.",en:"Let us hold fast the confession of our hope without wavering, for he who promised is faithful."},{r:"HEB.10.24",ms:"Marilah kita saling perhatikan satu sama lain untuk menimbulkan kasih dan perbuatan yang baik.",en:"And let us consider how to stir up one another to love and good works"},{r:"HEB.11.1",ms:"Iman adalah kepastian akan perkara-perkara yang diharapkan, keyakinan akan perkara-perkara yang tidak dilihat.",en:"Now faith is the assurance of things hoped for, the conviction of things not seen."},{r:"HEB.13.8",ms:"Yesus Kristus tetap sama kelmarin, hari ini dan selama-lamanya.",en:"Jesus Christ is the same yesterday and today and forever."},{r:"HEB.13.16",ms:"Tetapi jangan lupa berbuat baik dan berkongsi, kerana korban demikianlah yang diredai Allah.",en:"Do not neglect to do good and to share what you have, for such sacrifices are pleasing to God."},{r:"JAS.1.2",ms:"Saudara-saudaraku, anggaplah sebagai suatu kebahagiaan apabila kamu menghadapi pelbagai cubaan",en:"Count it all joy, my brothers, when you meet trials of various kinds"},{r:"JAS.1.17",ms:"Segala pemberian yang baik dan sempurna diturunkan dari syurga oleh Bapa, sumber segala cahaya. Dia tidak berubah dan tidak seperti bayangan yang berubah-ubah bentuknya.",en:"Every good gift and every perfect gift is from above, coming down from the Father of lights, with whom there is no variation or shadow due to change."},{r:"JAS.1.19",ms:"Saudara-saudara yang kukasihi, sebagaimana kamu tahu, seseorang haruslah cepat mendengar, lambat bercakap, dan lambat menjadi marah.",en:"Know this, my beloved brothers: let every person be quick to hear, slow to speak, slow to anger"},{r:"JAS.1.22",ms:"Namun demikian, jangan tipu dirimu dengan hanya mendengar firman; lakukanlah firman itu.",en:"But be doers of the word, and not hearers only, deceiving yourselves."},{r:"JAS.4.7",ms:"Oleh yang demikian, taatlah kepada Allah. Lawanlah Iblis, maka Iblis akan lari daripadamu.",en:"Submit yourselves therefore to God. Resist the devil, and he will flee from you."},{r:"JAS.4.8",ms:"Dampingi Allah, Allah akan mendampingimu. Basuh bersih tanganmu, wahai kamu yang berdosa. Sucikan hatimu, wahai kamu yang munafik.",en:"Draw near to God, and he will draw near to you. Cleanse your hands, you sinners, and purify your hearts, you double-minded."},{r:"JAS.5.16",ms:"Oleh itu, hendaklah kamu saling mengakui dosa serta mendoakan satu sama lain, supaya kamu disembuhkan. Doa orang yang benar mempunyai kuasa yang hebat.",en:"Therefore, confess your sins to one another and pray for one another, that you may be healed. The prayer of a righteous person has great power as it is working."},{r:"1PE.4.8",ms:"Paling utama, kasihilah satu sama lain kerana kasih akan menutup banyak dosa.",en:"Above all, keep loving one another earnestly, since love covers a multitude of sins."},{r:"1PE.4.10",ms:"Setiap orang antaramu telah menerima pelbagai kurnia daripada Allah. Sebagai pengurus yang baik bagi kurnia Allah, gunakanlah kurnia itu untuk kebaikan semua.",en:"As each has received a gift, use it to serve one another, as good stewards of Gods varied grace"},{r:"1PE.5.6",ms:"Oleh itu, rendahkan dirimu di bawah kuasa Allah, supaya kamu ditinggikan-Nya pada waktu yang telah ditetapkan.",en:"Humble yourselves, therefore, under the mighty hand of God so that at the proper time he may exalt you"},{r:"1PE.5.7",ms:"Serahkan segala kerunsinganmu kepada Allah, kerana Dia mengambil berat tentangmu.",en:"casting all your anxieties on him, because he cares for you."},{r:"2PE.3.9",ms:"Tuhan bukannya lengah menepati janji, seperti sangkaan sesetengah orang, tetapi amat bersabar dengan kita, kerana Dia tidak mahu seorang pun binasa dan Dia ingin semuanya bertaubat.",en:"The Lord is not slow to fulfill his promise as some count slowness, but is patient toward you, not wishing that any should perish, but that all should reach repentance."},{r:"2PE.3.18",ms:"Hendaklah kamu semakin kukuh dalam kasih kurnia Tuhan dan Penyelamat kita Yesus Kristus dan semakin mengenal-Nya. Bagi-Nya kemuliaan, sekarang dan selama-lamanya! Amin.",en:"But grow in the grace and knowledge of our Lord and Savior Jesus Christ. To him be the glory both now and to the day of eternity. Amen."},{r:"1JN.1.9",ms:"Tetapi jika kita mengakui dosa kita kepada Allah, Dia akan menepati janji-Nya dan berlaku adil. Dia akan mengampunkan dosa kita dan menyucikan kita daripada segala kesalahan.",en:"If we confess our sins, he is faithful and just to forgive us our sins and to cleanse us from all unrighteousness."},{r:"1JN.3.18",ms:"Anak-anakku, janganlah kasih kita di mulut sahaja. Kita hendaklah kasih-mengasihi melalui perbuatan dan kebenaran yang sejati.",en:"Little children, let us not love in word or talk but in deed and in truth."},{r:"1JN.4.4",ms:"Namun demikian, anak-anakku, kamu milik Allah. Kamu telah menewaskan nabi-nabi palsu itu, kerana roh yang ada padamu lebih berkuasa daripada roh yang ada di dalam dunia.",en:"Little children, you are from God and have overcome them, for he who is in you is greater than he who is in the world."},{r:"1JN.4.7",ms:"Saudara-saudara yang kukasihi, marilah kita kasih-mengasihi kerana kasih itu datang daripada Allah. Sesiapa yang kasih-mengasihi lahir daripada Allah dan mereka mengenal Allah.",en:"Beloved, let us love one another, for love is from God, and whoever loves has been born of God and knows God."},{r:"1JN.4.8",ms:"Sesiapa yang tidak mengasihi sesama manusia tidak mengenal Allah kerana Allah itu kasih.",en:"Anyone who does not love does not know God, because God is love."},{r:"1JN.4.16",ms:"Kita tahu dan yakin sepenuh hati bahawa Allah mengasihi kita. Allah itu kasih. Sesiapa yang sentiasa mengasihi sesama manusia tetap ada di dalam Allah, dan Allah tetap di dalam dia.",en:"So we have come to know and to believe the love that God has for us. God is love, and whoever abides in love abides in God, and God abides in him."},{r:"1JN.4.19",ms:"Kita mengasihi sesama manusia kerana Tuhan terlebih dahulu mengasihi kita.",en:"We love because he first loved us."},{r:"1JN.5.14",ms:"Kita dapat menghadap Allah dengan keyakinan bahawa Dia mengabulkan segala doa kita yang selaras dengan kehendak-Nya.",en:"And this is the confidence that we have toward him, that if we ask anything according to his will he hears us."},{r:"2JN.1.6",ms:"Inilah kasih, iaitu mengasihi bermakna hidup mengikut perintah Allah. Inilah perintah yang kamu dengar dari mulanya: Kamu haruslah kasih-mengasihi.",en:"And this is love, that we walk according to his commandments; this is the commandment, just as you have heard from the beginning, so that you should walk in it."},{r:"3JN.1.2",ms:"Aku berdoa semoga kamu berada dalam keadaan sejahtera serta sihat jasmanimu sebagaimana rohanimu berbahagia.",en:"Beloved, I pray that all may go well with you and that you may be in good health, as it goes well with your soul."},{r:"3JN.1.4",ms:"Tiada yang lebih membahagiakanku daripada berita bahawa anak-anakku hidup mengikut kebenaran.",en:"I have no greater joy than to hear that my children are walking in the truth."},{r:"JUD.1.21",ms:"Hiduplah di bawah naungan kasih Allah sementara menunggu belas kasihan Tuhan kita Yesus Kristus yang akan menganugerahimu hidup kekal.",en:"keep yourselves
