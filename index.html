<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SIB Piasau</title>
  <meta name="description" content="Aplikasi gereja SIB Piasau, Kota Belud — acara dan RSVP.">
  <meta name="theme-color" content="#2B2F7A">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SIB Piasau">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <!-- Text size (Small/Medium/Large) applied before first paint so there is no flash. Same logic as ui.js getTextSize(). -->
  <script>try{var z=localStorage.getItem('sibp-textsize');if(['small','medium','large'].indexOf(z)<0)z=localStorage.getItem('sibp-big-text')==='1'?'large':'medium';document.documentElement.setAttribute('data-textsize',z)}catch(e){document.documentElement.setAttribute('data-textsize','medium')}</script>
  <style>
/* SIB Piasau — minimalist, elderly-friendly. Colours from the logo.
   navy #2B2F7A text/headers · sky #1BA8E0 primary buttons/active · yellow #FFF200 soft highlight only
   red #E31E24 only for warnings / cancel / Not Going. All sizes in rem so the phone's text-size setting applies;
   --s scales everything (text, buttons, inputs, PIN pad, icons, spacing) for the in-app Text size setting:
   Small 0.9 · Medium 1 (default, the original look) · Large 1.2. Set on <html data-textsize> before first paint (index.html). */
:root {
  --navy: #2B2F7A; --sky: #1BA8E0; --sky-tint: #E3F4FB; --yellow: #FFF200; --yellow-soft: #FFFBD1; --red: #E31E24; --red-text: #C8161C; --red-tint: #FDECEC;
  --ink: #2B2F7A; --muted: #4A4E78; --line: #D9DBEA; --field: #6B6F9A; --soft: #F3F4FA; --white: #FFFFFF;
  --s: 1;
  --tap: max(44px, calc(3rem * var(--s)));   /* 48px tap target at Medium, never below 44px */
  --sp: calc(1rem * var(--s));               /* 16px base spacing */
  --fs: calc(1.125rem * var(--s));        /* 18px body */
  --fs-lg: calc(1.25rem * var(--s));      /* 20px buttons */
  --fs-h2: calc(1.5rem * var(--s));       /* 24px */
  --fs-h1: calc(1.75rem * var(--s));      /* 28px */
  --btn-h: calc(3.5rem * var(--s));       /* 56px */
  --radius: 14px;
  --tabs-h: calc(4.5rem * var(--s));
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
html[data-textsize="small"] { --s: .9; }   /* body 16.2px, buttons 50px */
html[data-textsize="large"] { --s: 1.2; }  /* body 21.6px, buttons 67px */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* iOS: follow the Dynamic Type (Settings › Display › Text Size) setting */
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--white); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  font-size: var(--fs); line-height: 1.5; -webkit-tap-highlight-color: transparent;
  padding-bottom: calc(var(--bar-h, calc(var(--tabs-h) + var(--safe-b))) + 24px); /* --bar-h: measured toolbar height (app.js) */
}
body.no-chrome { padding-bottom: calc(var(--safe-b) + 24px); }
h1 { font-size: var(--fs-h1); line-height: 1.25; margin: calc(8px * var(--s)) 0 calc(12px * var(--s)); font-weight: 800; }
h2 { font-size: var(--fs-h2); line-height: 1.3; margin: calc(28px * var(--s)) 0 calc(12px * var(--s)); font-weight: 800; }
p { margin: 8px 0; }
a { color: var(--navy); }
img { max-width: 100%; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--navy); color: #fff; padding: 12px 16px; z-index: 100; }
.skip:focus { left: 8px; }
.center { text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.lead { font-size: var(--fs); color: var(--muted); }
.muted { color: var(--muted); }
.small-print { font-size: var(--fs); color: var(--muted); }
.hint { background: var(--yellow-soft); border-radius: 10px; padding: 8px 12px; color: var(--navy); display: inline-block; }
p.hint.center { display: block; }
.ic { flex: none; }
.loading { padding: 40px; text-align: center; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20; background: var(--white); border-bottom: 2px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(8px + var(--safe-t)) 12px 8px 12px; min-height: calc(64px * var(--s));
}
.topbar:empty { display: none; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--navy); font-weight: 800; font-size: calc(1.5rem * var(--s)); min-height: var(--tap); min-width: 0; flex: 1; }
.brand img { width: min(calc(44px * var(--s)), 48px); height: min(calc(44px * var(--s)), 48px); object-fit: contain; flex: none; }
/* v0.7.0: the name uses the space freed by the icon-only menu button; never cut off — wraps to two lines if it must (Large) */
.brand span { white-space: normal; overflow-wrap: anywhere; line-height: 1.15; min-width: 0; }
.menu-btn { flex: none; }
.menu-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px; min-height: max(48px, var(--tap)); min-width: max(48px, var(--tap)); padding: 0 calc(8px * var(--s));
  background: var(--white); color: var(--navy); border: 2px solid var(--navy); border-radius: 12px;
  font: inherit; font-weight: 700; cursor: pointer;
}

/* ---------- bottom toolbar (v0.7.0): members Utama | Sel | RSVP | Profil · admins/owner Utama | Sel | (+) | RSVP | Profil ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: stretch;
  background: var(--white); border-top: 2px solid var(--line); padding-bottom: var(--safe-b); box-shadow: 0 -4px 14px rgba(43, 47, 122, .08);
}
.tabs.tabs-admin { grid-template-columns: repeat(5, minmax(0, 1fr)); }   /* equal columns: the + sits in the exact centre */
.tabs:empty { display: none; }
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; min-height: var(--tabs-h); min-width: 0;
  text-decoration: none; color: var(--muted); font-weight: 800; position: relative; padding: 8px 2px 8px;
}
.tab > span { font-size: min(var(--fs), 1.125rem); line-height: 1.15; text-align: center; white-space: nowrap; }  /* one short word, never wrapped or cut */
.tab .ic { stroke-width: 2; }
.tab.active { color: var(--navy); background: var(--sky-tint); }
.tab.active .ic { color: #0E7FB0; }
.tab.active::before { content: ""; position: absolute; top: -2px; left: 14%; right: 14%; height: 5px; border-radius: 0 0 4px 4px; background: var(--sky); }
/* Centre "+" (admins/owner): plus-in-circle line icon, sky fill, raised above the bar */
.tab-new { color: var(--navy); padding-top: calc(40px * var(--s)); }
.tab-new.active { background: transparent; }
.tab-new.active::before { display: none; }
.tab-plus { position: absolute; top: calc(-22px * var(--s)); left: 50%; transform: translateX(-50%); display: flex; border-radius: 50%; background: var(--white);
  padding: 3px; box-shadow: 0 4px 12px rgba(43, 47, 122, .22); }
.tab-plus .ic { color: var(--navy); }
.tab-plus .ic circle { fill: var(--sky); }
.tab-new:active .tab-plus .ic circle { fill: #1797C9; }
.tab-new.active .tab-plus { box-shadow: 0 0 0 4px var(--yellow), 0 4px 12px rgba(43, 47, 122, .22); }
.tab-new.active .ic { color: var(--navy); }

/* ---------- page ---------- */
main { display: block; outline: none; }
.page, .auth { padding: calc(12px * var(--s)) 16px var(--sp); max-width: 640px; margin: 0 auto; }
.back {
  display: flex; width: fit-content; align-items: center; gap: 4px; min-height: var(--tap); padding: 4px 12px 4px 4px; margin: 0 0 4px -4px;
  color: var(--navy); font-weight: 700; text-decoration: none; border-radius: 10px;
}
.back:active { background: var(--soft); }

/* ---------- buttons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: var(--btn-h);
  margin: calc(14px * var(--s)) 0; padding: calc(10px * var(--s)) calc(18px * var(--s)); border-radius: var(--radius); border: 2px solid transparent;
  font: inherit; font-size: var(--fs-lg); font-weight: 800; line-height: 1.25; text-decoration: none; text-align: center; cursor: pointer;
}
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
/* aria-disabled (not disabled): still tappable so the page can say what is missing */
/* Sky blue with navy text: brand colour and AA contrast for large bold text (white on sky blue is too faint). */
.btn-primary { background: var(--sky); color: var(--navy); border-color: var(--sky); }
.btn-primary:active:not(:disabled) { background: #1797C9; }
.btn-outline { background: var(--white); color: var(--navy); border-color: var(--navy); }
.btn-outline:active:not(:disabled) { background: var(--soft); }
.btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
.btn-danger-outline { background: var(--white); color: var(--red-text); border-color: var(--red); }
.btn-ghost { background: transparent; color: var(--navy); text-decoration: underline; font-weight: 700; font-size: var(--fs); }
.btn-sm { width: auto; min-height: var(--tap); margin: 0; padding: 6px 12px; font-size: var(--fs); flex: none; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-row .btn { margin: 8px 0 0; padding: 8px; }
.link { font-weight: 800; color: var(--navy); text-decoration: underline; text-underline-offset: 3px; display: inline-block; padding: 10px 4px; min-height: var(--tap); }

/* ---------- forms ---------- */
.field-label { display: block; font-weight: 800; margin: calc(18px * var(--s)) 0 6px; font-size: var(--fs); color: var(--navy); }
.input {
  display: block; width: 100%; min-height: var(--btn-h); padding: calc(10px * var(--s)) calc(14px * var(--s)); font: inherit; font-size: var(--fs); color: var(--ink);
  background: var(--white); border: 2px solid var(--field); border-radius: 12px; -webkit-appearance: none; appearance: none;
}
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--navy) 50%), linear-gradient(135deg, var(--navy) 50%, transparent 50%);
  background-position: calc(100% - 22px) 50%, calc(100% - 15px) 50%; background-size: 7px 7px; background-repeat: no-repeat; padding-right: 40px; text-overflow: ellipsis; }
textarea.input { min-height: calc(120px * var(--s)); resize: vertical; }
.input:focus { border-color: var(--sky); outline: 3px solid var(--sky-tint); }
.err { color: var(--red-text); font-weight: 700; background: var(--red-tint); padding: 10px 14px; border-radius: 10px; }
.err[hidden] { display: none; }
.code-input { font-size: calc(2rem * var(--s)); letter-spacing: .5em; text-align: center; font-weight: 800; }
.check-row { display: flex; gap: 12px; align-items: flex-start; padding: 14px; margin: 16px 0; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
.check-row input { width: calc(28px * var(--s)); height: calc(28px * var(--s)); margin: 2px 0 0; accent-color: var(--sky); flex: none; }
.search { position: relative; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: calc(26px + 24px * var(--s)); }
.filter-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.filter-grid > * { min-width: 0; }
.filter-grid .input { min-width: 0; padding-left: 10px; padding-right: 10px; }
.filter-grid .field-label { margin-top: 14px; }

/* ---------- auth ---------- */
.auth-top { display: flex; justify-content: flex-end; align-items: center; min-height: calc(56px * var(--s)); padding-top: var(--safe-t); }
.auth-top.split { justify-content: space-between; gap: 8px; }
.lang-btn { display: inline-flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 0 14px; border: 2px solid var(--navy); border-radius: 12px; background: #fff; color: var(--navy); font: inherit; font-weight: 700; cursor: pointer; }
.auth-logo { display: block; margin: 4px auto 4px; width: calc(112px * var(--s)); height: calc(112px * var(--s)); object-fit: contain; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); margin: 8px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 2px; background: var(--line); }
.reg-link { margin-top: 12px; }
.step-count { font-weight: 700; color: var(--muted); }
.progress { height: 8px; background: var(--soft); border-radius: 8px; overflow: hidden; margin: 4px 0 12px; }
.progress span { display: block; height: 100%; background: var(--sky); border-radius: 8px; }
.option {
  display: flex; align-items: center; gap: var(--sp); width: 100%; min-height: calc(80px * var(--s)); margin: calc(14px * var(--s)) 0; padding: calc(14px * var(--s)) calc(18px * var(--s)); text-align: left;
  background: #fff; border: 2px solid var(--navy); border-radius: var(--radius); color: var(--navy); font: inherit; cursor: pointer; overflow-wrap: anywhere;
}
.option strong { font-size: var(--fs-lg); }
.option:active { background: var(--sky-tint); }
.note { display: flex; gap: 12px; align-items: flex-start; background: var(--yellow-soft); border-left: 6px solid var(--yellow); border-radius: 12px; padding: 14px; margin: 12px 0; }
.note p { margin: 0; }
.file-btn { position: relative; }
.big-ok { color: var(--sky); margin: 32px 0 8px; }

/* ---------- PIN pad ---------- */
.pinpad { margin: 8px auto; max-width: calc(360px * var(--s)); }
.pin-label { text-align: center; font-weight: 800; font-size: var(--fs-lg); margin: 4px 0 10px; }
.pin-dots { display: flex; justify-content: center; gap: calc(14px * var(--s)); margin-bottom: calc(18px * var(--s)); }
.pin-dots span { width: calc(22px * var(--s)); height: calc(22px * var(--s)); border-radius: 50%; border: 3px solid var(--navy); }
.pin-dots span.on { background: var(--navy); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(12px * var(--s)); }
.key {
  min-height: calc(4.25rem * var(--s)); border-radius: 16px; border: 2px solid var(--line); background: var(--soft); color: var(--navy);
  font: inherit; font-size: calc(1.875rem * var(--s)); font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
}
.key:active { background: var(--sky-tint); border-color: var(--sky); }
.key-del { font-size: var(--fs); flex-direction: column; gap: 0; background: #fff; }
.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

/* ---------- cards / lists ---------- */
.cards { list-style: none; margin: calc(12px * var(--s)) 0; padding: 0; display: grid; gap: calc(12px * var(--s)); }
.card { display: block; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: calc(14px * var(--s)); color: var(--ink); text-decoration: none; }
a.card:active { background: var(--soft); }
.event-card { display: flex; gap: calc(14px * var(--s)); align-items: flex-start; }
.datebox { flex: none; width: calc(64px * var(--s)); border-radius: 12px; background: var(--navy); color: #fff; text-align: center; padding: 8px 0 6px; line-height: 1.1; }
.datebox b { display: block; font-size: calc(1.75rem * var(--s)); }
.datebox span { font-size: var(--fs); text-transform: uppercase; font-weight: 700; }
.ec-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ec-title { font-weight: 800; font-size: var(--fs-lg); line-height: 1.3; margin: 0; }
.ec-meta { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); }
.ec-meta .ic { margin-top: 3px; }
.ec-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.is-cancelled .ec-title { text-decoration: line-through; }
.chip, .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: var(--fs); line-height: 1.3; }
.badge-going { background: var(--sky-tint); color: var(--navy); border: 2px solid var(--sky); }
.badge-maybe { background: var(--soft); color: var(--navy); border: 2px solid var(--navy); }
.badge-not_going { background: var(--red-tint); color: var(--red-text); border: 2px solid var(--red); }
.empty { text-align: center; color: var(--muted); padding: 32px 12px; }
.empty .ic { color: var(--navy); }
.info-card p { margin: 4px 0; }

/* ---------- drawer (right side) ---------- */
.drawer-back { position: fixed; inset: 0; background: rgba(20, 22, 60, .5); z-index: 40; opacity: 0; transition: opacity .2s; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(88vw, 380px); background: #fff; overflow-y: auto;
  box-shadow: -8px 0 24px rgba(0,0,0,.18); transform: translateX(100%); transition: transform .22s ease-out;
  padding: calc(8px + var(--safe-t)) 0 calc(16px + var(--safe-b));
}
#drawer-root.open .drawer { transform: none; }
#drawer-root.open .drawer-back { opacity: 1; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 12px 8px 20px; border-bottom: 2px solid var(--line); }
.drawer-head h2 { margin: 8px 0; }
.close-btn { display: flex; align-items: center; gap: 6px; min-height: var(--tap); padding: 0 14px; border: 2px solid var(--navy); border-radius: 12px; background: #fff; color: var(--navy); font: inherit; font-weight: 700; cursor: pointer; }
.cat-list { list-style: none; margin: 0; padding: 0; }
.cat-row { display: flex; align-items: center; gap: var(--sp); min-height: calc(72px * var(--s)); padding: 10px 16px 10px 20px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--navy); }
.cat-row:active { background: var(--soft); }
.cat-ic { display: inline-flex; align-items: center; justify-content: center; width: calc(52px * var(--s)); height: calc(52px * var(--s)); border-radius: 50%; flex: none; }
.cat-name { flex: 1; font-weight: 800; font-size: var(--fs-lg); }
.chev { color: var(--muted); }
.cat-sub { display: block; font-weight: 600; font-size: var(--fs); color: var(--muted); line-height: 1.3; margin: 0; }
.cat-head { display: flex; align-items: center; gap: 14px; margin: 4px 0 8px; }
.cat-head .cat-ic { width: calc(60px * var(--s)); height: calc(60px * var(--s)); }
.cat-head h1 { margin: 0; }

/* ---------- event detail ---------- */
.ev-title { margin-top: 12px; }
.facts { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 10px; }
.facts li { display: flex; gap: 12px; align-items: flex-start; font-weight: 600; }
.facts .ic { color: var(--sky); margin-top: 1px; }
.ev-details { background: var(--soft); border-radius: 12px; padding: 14px; }
.rsvp-q { margin-bottom: 4px; }
.rsvp-btns .btn { margin: 12px 0; min-height: calc(4rem * var(--s)); font-size: calc(1.375rem * var(--s)); border-width: 3px; }
.btn-going { background: var(--sky-tint); color: var(--navy); border-color: var(--sky); }
.btn-going .ic { color: #0E7FB0; }
.btn-going.selected { background: var(--sky); }
.btn-going.selected .ic { color: var(--navy); }
.btn-maybe { background: #fff; color: var(--navy); border-color: var(--navy); }
.btn-maybe.selected { background: var(--navy); color: #fff; }
.btn-notgoing { background: #fff; color: var(--red-text); border-color: var(--red); }
.btn-notgoing.selected { background: var(--red); color: #fff; }
.rsvp-btn.selected { box-shadow: 0 0 0 4px var(--yellow); }
.sel-tag { font-size: var(--fs); font-weight: 700; padding: 2px 10px; border-radius: 999px; background: rgba(255,255,255,.9); color: var(--navy); }
.stepper-wrap[hidden] { display: none; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.step-btn { flex: 1; min-height: calc(4rem * var(--s)); display: flex; align-items: center; justify-content: center; gap: 6px; border: 2px solid var(--navy); border-radius: 14px;
  background: #fff; color: var(--navy); font: inherit; font-weight: 800; cursor: pointer; }
.step-btn:active { background: var(--sky-tint); }
.step-val { min-width: calc(72px * var(--s)); text-align: center; font-size: calc(2.25rem * var(--s)); font-weight: 800; }
.counts { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 20px 0 4px; padding: 12px 14px; border-radius: 12px; background: var(--soft); }
.counts span { display: inline-flex; align-items: center; gap: 6px; }
.warn { display: flex; gap: 12px; align-items: flex-start; background: var(--red-tint); color: var(--red-text); border: 2px solid var(--red); border-radius: 12px; padding: 12px 14px; font-weight: 700; margin: 12px 0; }
.warn p { margin: 0; }

/* ---------- profile ---------- */
.me-card { display: flex; align-items: center; gap: var(--sp); margin: calc(12px * var(--s)) 0; }
.me-card > div { min-width: 0; overflow-wrap: anywhere; }
.me-name { font-weight: 800; font-size: var(--fs-lg); margin: 0; line-height: 1.3; }
.me-card p { margin: 2px 0; }
.role-tag { display: inline-block; margin-top: 4px !important; padding: 2px 12px; border-radius: 999px; background: var(--yellow-soft); border: 2px solid #E6D900; font-weight: 700; }
