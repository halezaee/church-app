# Keeps the Supabase free project awake (it pauses after 7 days with no activity).
# Runs every 3 days. Needs repo secrets SUPABASE_URL and SUPABASE_ANON_KEY.
name: Supabase keep-alive
on:
  schedule:
    - cron: "0 1 */3 * *"   # 01:00 UTC = 09:00 Sabah time
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/churches?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          test "$code" -lt 500
