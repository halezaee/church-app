# Keeps the Supabase free project awake (it pauses after 7 days with no activity).
# Runs every 3 days. Needs repo secrets SUPABASE_URL and SUPABASE_ANON_KEY.
name: Supabase keep-alive
on:
  schedule:
    - cron: "0 1 */3 * *"   # 01:00 UTC = 09:00 Sabah time
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          # v0.9.0: anon has no table access any more, so ping the public RPC list_churches() (a real DB query).
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/list_churches" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          test "$code" = 200
